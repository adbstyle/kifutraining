<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1135 1040" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="netShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3ee"/>
      <stop offset="1" stop-color="#c7d3c7"/>
    </linearGradient>

    <!-- Kind, dunkle Haare (Team Rot) -->
    <symbol id="kidA" viewBox="0 0 60 120">
      <rect x="21" y="70" width="7" height="34" rx="3" fill="#e8b48a"/>
      <rect x="32" y="70" width="7" height="34" rx="3" fill="#e8b48a"/>
      <rect x="19" y="100" width="11" height="9" rx="3" fill="#2b2b2b"/>
      <rect x="30" y="100" width="11" height="9" rx="3" fill="#2b2b2b"/>
      <rect x="19" y="56" width="22" height="18" rx="4" fill="#222"/>
      <rect x="11" y="34" width="7" height="24" rx="3.5" fill="currentColor"/>
      <rect x="42" y="34" width="7" height="24" rx="3.5" fill="currentColor"/>
      <rect x="16" y="32" width="28" height="28" rx="7" fill="currentColor"/>
      <circle cx="30" cy="20" r="12" fill="#f3c89a"/>
      <path d="M18 17 a12 12 0 0 1 24 0 q-12 -9 -24 0Z" fill="#5a3a1e"/>
    </symbol>

    <!-- Kind, gelbe Haare (Team Weiss) -->
    <symbol id="kidB" viewBox="0 0 60 120">
      <rect x="21" y="70" width="7" height="34" rx="3" fill="#e8b48a"/>
      <rect x="32" y="70" width="7" height="34" rx="3" fill="#e8b48a"/>
      <rect x="19" y="100" width="11" height="9" rx="3" fill="#2b2b2b"/>
      <rect x="30" y="100" width="11" height="9" rx="3" fill="#2b2b2b"/>
      <rect x="19" y="56" width="22" height="18" rx="4" fill="#444"/>
      <rect x="11" y="34" width="7" height="24" rx="3.5" fill="currentColor" stroke="#b8c0b8" stroke-width="1"/>
      <rect x="42" y="34" width="7" height="24" rx="3.5" fill="currentColor" stroke="#b8c0b8" stroke-width="1"/>
      <rect x="16" y="32" width="28" height="28" rx="7" fill="currentColor" stroke="#b8c0b8" stroke-width="1.5"/>
      <circle cx="30" cy="20" r="12" fill="#f3c89a"/>
      <path d="M18 17 a12 12 0 0 1 24 0 q-12 -9 -24 0Z" fill="#f2c200"/>
    </symbol>

    <!-- Mini-Tor (Netz-Kuppel), Öffnung nach unten -->
    <symbol id="goal" viewBox="0 0 160 110">
      <path d="M6 104 A74 74 0 0 1 154 104 Z" fill="url(#netShade)" stroke="#9aa79a" stroke-width="3"/>
      <g stroke="#9aa79a" stroke-width="1.4" fill="none" opacity="0.7">
        <path d="M28 104 A60 60 0 0 1 132 104"/>
        <path d="M48 104 A44 44 0 0 1 112 104"/>
        <line x1="40" y1="46" x2="40" y2="104"/>
        <line x1="60" y1="33" x2="60" y2="104"/>
        <line x1="80" y1="30" x2="80" y2="104"/>
        <line x1="100" y1="33" x2="100" y2="104"/>
        <line x1="120" y1="46" x2="120" y2="104"/>
      </g>
      <rect x="2" y="103" width="156" height="6" rx="3" fill="#7d8a7d"/>
    </symbol>

    <!-- Mini-Tor gespiegelt (Öffnung nach oben) -->
    <symbol id="goalDown" viewBox="0 0 160 110">
      <g transform="translate(0,110) scale(1,-1)">
        <path d="M6 104 A74 74 0 0 1 154 104 Z" fill="url(#netShade)" stroke="#9aa79a" stroke-width="3"/>
        <g stroke="#9aa79a" stroke-width="1.4" fill="none" opacity="0.7">
          <path d="M28 104 A60 60 0 0 1 132 104"/>
          <path d="M48 104 A44 44 0 0 1 112 104"/>
          <line x1="40" y1="46" x2="40" y2="104"/>
          <line x1="60" y1="33" x2="60" y2="104"/>
          <line x1="80" y1="30" x2="80" y2="104"/>
          <line x1="100" y1="33" x2="100" y2="104"/>
          <line x1="120" y1="46" x2="120" y2="104"/>
        </g>
        <rect x="2" y="103" width="156" height="6" rx="3" fill="#7d8a7d"/>
      </g>
    </symbol>

    <!-- Hütchen -->
    <symbol id="cone" viewBox="0 0 60 60">
      <ellipse cx="30" cy="50" rx="22" ry="7" fill="#a51f17"/>
      <path d="M30 8 L46 50 L14 50 Z" fill="#d6322e"/>
      <path d="M30 8 L40 35 L20 35 Z" fill="#e85a50" opacity="0.6"/>
    </symbol>

    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto">
      <path d="M0 1 L10 6 L0 11 Z" fill="#1c1c1c"/>
    </marker>
  </defs>

  <!-- Rasen mit vertikalen Streifen -->
  <rect width="1135" height="1040" fill="#6fae54"/>
  <g fill="#67a64d">
    <rect x="0"    width="142" height="1040"/>
    <rect x="284"  width="142" height="1040"/>
    <rect x="568"  width="142" height="1040"/>
    <rect x="852"  width="142" height="1040"/>
  </g>

  <!-- Spielfeld-Markierung -->
  <g fill="none" stroke="#f4f8f4" stroke-width="4">
    <rect x="180" y="150" width="775" height="730"/>
    <line x1="180" y1="515" x2="955" y2="515" stroke-dasharray="20 18"/>
  </g>

  <!-- Mini-Tore in allen vier Ecken -->
  <use href="#goal"     x="222" y="49"  width="156" height="107"/>  <!-- oben links -->
  <use href="#goal"     x="757" y="49"  width="156" height="107"/>  <!-- oben rechts -->
  <use href="#goalDown" x="222" y="874" width="156" height="107"/>  <!-- unten links -->
  <use href="#goalDown" x="757" y="874" width="156" height="107"/>  <!-- unten rechts -->

  <!-- Hütchen an der Mittellinie -->
  <use href="#cone" x="154" y="489" width="52" height="52"/>
  <use href="#cone" x="929" y="489" width="52" height="52"/>

  <!-- Team Rot (3 Kinder) im Feld, obere Hälfte -->
  <g style="color:#d6322e">
    <use href="#kidA" x="360" y="200"  width="70" height="140"/>
    <use href="#kidA" x="500" y="194"  width="70" height="140"/>
    <use href="#kidA" x="640" y="200"  width="70" height="140"/>
  </g>

  <!-- Team Weiss (3 Kinder) im Feld: zwei in der unteren Hälfte + Werfer in der Mitte -->
  <g style="color:#ffffff">
    <use href="#kidB" x="370" y="610" width="70" height="140"/>
    <use href="#kidB" x="615" y="610" width="70" height="140"/>
  </g>

  <!-- Wurf-Flugbahn des Handballs (Bogen Richtung Tor oben rechts) -->
  <path d="M548 458 Q700 270 833 168" fill="none" stroke="#1c1c1c" stroke-width="3.5"
        stroke-dasharray="2 12" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Werfer (Team Weiss, gelbe Mütze), Wurfarm erhoben -->
  <g transform="translate(470,455)">
    <rect x="21" y="70" width="8" height="36" rx="3.5" fill="#e8b48a"/>
    <rect x="33" y="70" width="8" height="36" rx="3.5" fill="#e8b48a"/>
    <rect x="18" y="102" width="13" height="10" rx="3" fill="#2b2b2b"/>
    <rect x="31" y="102" width="13" height="10" rx="3" fill="#2b2b2b"/>
    <rect x="18" y="55" width="25" height="19" rx="4" fill="#444"/>
    <rect x="9" y="33" width="8" height="26" rx="4" fill="#ffffff" stroke="#b8c0b8" stroke-width="1.2"/>
    <rect x="14" y="30" width="31" height="30" rx="7" fill="#ffffff" stroke="#b8c0b8" stroke-width="1.6"/>
    <path d="M40 36 L62 12" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
    <path d="M40 36 L62 12" stroke="#e8b48a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="29" cy="18" r="12.5" fill="#f3c89a"/>
    <path d="M16 16 a13 13 0 0 1 26 0 q-13 -10 -26 0Z" fill="#f2c200"/>
    <circle cx="29" cy="3" r="3" fill="#f2c200"/>
    <!-- Handball in der Wurfhand -->
    <g transform="translate(63,9)">
      <circle r="11" fill="#f2c200" stroke="#c99a00" stroke-width="2"/>
      <path d="M-9 -3 Q0 4 9 -3 M-6 6 Q0 0 6 6 M0 -11 L0 11" stroke="#a06b00" stroke-width="1.6" fill="none"/>
    </g>
  </g>
</svg>
