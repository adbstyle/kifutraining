name: PR Checks

on:
  pull_request:
    paths:
      - "web/**"
      - "supabase/**"
      - ".github/workflows/**"

jobs:
  web:
    name: Typecheck (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run gen:vocab
      - run: npm run typecheck

  migrations:
    name: Migrationen anwendbar (Wegwerf-DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Lokalen Stack starten und Migrationen + seed.sql anwenden
        run: supabase db start
      # 'supabase db start' (bzw. 'supabase start' + 'db reset') schlägt fehl,
      # wenn eine Migration kaputt ist -> fängt Schema-Fehler früh ab.
