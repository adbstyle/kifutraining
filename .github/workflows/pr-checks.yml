name: PR Checks

on:
  pull_request:
    paths:
      - "web/**"
      - "supabase/**"
      - ".github/workflows/**"

jobs:
  web:
    name: Typecheck (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run gen:vocab
      - run: npm run typecheck

  migrations:
    name: Migrationen + Seed (Wegwerf-DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Lokalen Stack starten und Migrationen + seed.sql anwenden
        run: supabase start
      # 'supabase start' fährt den vollen lokalen Stack hoch und wendet alle
      # Migrationen + seed.sql an -> schlägt fehl, wenn eine Migration kaputt ist
      # und validiert so die Schema-Änderungen wirklich.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Seed-Env aus dem lokalen Stack übernehmen
        run: |
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      # Manual-Seed gegen die Wegwerf-DB: prüft auf JEDEM PR den Seed-Runtime
      # (Node/supabase-js — sonst bricht seed-prod erst im Ernstfall) UND dass
      # alle YAML-Daten sämtliche Constraints erfüllen (z. B. Hauptteilkategorie).
      - name: Manual-Seed gegen Wegwerf-DB
        working-directory: web
        run: |
          npm ci
          npm run seed
