name: PR Checks

on:
  pull_request:
    paths:
      - "web/**"
      - "supabase/**"
      - ".github/workflows/**"
      # Quelle des generierten Produktwissens im Feedback-Dialog (#541).
      - "docs/feedback-triage.md"

jobs:
  workflow-waechter:
    name: Workflow-Wächter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # reset-staging.yml löscht alle Daten des Ziels samt Konten und darf nur
      # Staging kennen: kein Prod-Secret in der Datei, auch nicht in
      # Index-Schreibweise (secrets[...]) oder als Ganzes (toJSON(secrets)).
      # Ohne Gross-/Kleinschreibung, wie GitHub Secret-Namen behandelt.
      - name: reset-staging.yml ohne Prod-Secrets
        run: |
          DATEI=.github/workflows/reset-staging.yml
          test -f "$DATEI"
          if grep -niE 'SUPABASE_PROD_|secrets\.SUPABASE_(DB_PASSWORD|URL|SERVICE_ROLE_KEY)\b|secrets[[:space:]]*\[|toJSON[[:space:]]*\([[:space:]]*secrets' "$DATEI"; then
            echo "::error::$DATEI nennt ein Prod-Secret oder greift auf secrets als Ganzes bzw. per Index zu (siehe Zeilen oben)."
            exit 1
          fi

  # Eigener Job, damit die übrigen ihr Ergebnis weiter zeigen: Solange der
  # Default von vereine_nachziehen der Platzhalter ist, legte der Backfill auf
  # Prod «FC Wyler» ohne Verwaltung an (AP §6.1 Schritt −1, §6.3). Der Job
  # «Prod-Weg» merkt das nicht, weil er genau dieses Konto anlegt.
  konto-platzhalter:
    name: Verwaltungskonto im Backfill eingesetzt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Default von vereine_nachziehen ist kein Platzhalter
        run: |
          DATEI=supabase/migrations/20261113100000_vereine_fundament.sql
          KONTO=$(sed -n "s/.*p_verwaltung uuid default '\([0-9a-f-]*\)'::uuid.*/\1/p" "$DATEI")
          if [ -z "$KONTO" ]; then
            echo "::error file=$DATEI::Default von vereine_nachziehen(p_verwaltung) nicht gefunden."
            exit 1
          fi
          if [ "$KONTO" = "00000000-0000-0000-0000-000000000000" ]; then
            echo "::error file=$DATEI::Platzhalter statt Konto-ID: Vor dem Merge die auth.users.id des Verwaltungskontos als Default von vereine_nachziehen einsetzen (Zeile mit KONTO_ID_PLATZHALTER, AP §6.1 Schritt −1)."
            exit 1
          fi
          echo "Verwaltungskonto: $KONTO"

  web:
    name: Typecheck (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run gen:vocab
      - run: npm run typecheck
      # Inhalt der gezeichneten Vorlagen: unbekannte Symbol-Typen/Farben,
      # doppelte IDs, Elemente ausserhalb der Zeichenfläche. parseDiagramm
      # allein würde das durchlassen (Fallback-Rendering).
      - run: npm run check:diagramme
      # Regeln eines Feld-Diagramms (Story #145/#146): Grenzen gegen Mängel,
      # dieselben beim Speichern aus der Übungsmaske und beim Setzen über den
      # KI-Assistenten. Nie ablehnen, was der Editor erzeugt (er klemmt die
      # Mitte eines Symbols, nicht den Rahmen), beim Normalisieren kein Feld
      # verlieren, und der Diagramm-Katalog sagt, was die Prüfung tut.
      - run: npm run check:diagramm-regeln
      # Regeln für Gruppen-Bezeichnungen: der TS-Zwilling des Unique-Index
      # tg_name_je_training. Läuft er auseinander, bekommt der Trainer statt
      # einer Meldung am Feld einen Datenbankfehler.
      - run: npm run check:gruppen
      # Regeln für Varianten des Hauptteils: der TS-Zwilling von
      # tv_name_je_training und des CHECK te_variante_genau_bei_hauptteil.
      # Läuft er auseinander, blendet der Editor erfasste Übungen aus.
      - run: npm run check:varianten
      # Farbpalette: der TS-Zwilling des @theme-Blocks in app/globals.css plus
      # die Kontrastrechnung nach WCAG 2.1 und der Wächter über die alte
      # Palette. Tailwind v4 meldet unbekannte Utilities nicht — eine vergessene
      # Klasse erzeugt still keine Regel, und der Text erbt die Elternfarbe.
      - run: npm run check:farben
      # Farbsätze des Feld-Diagramms: Vollständigkeit der Rollen in beiden
      # Sätzen (Bildschirm und Papier), Kontrast 3:1 nach WCAG 1.4.11 für
      # gezeichnete Gegenstände, und das Verbot roher Farbwerte im
      # Zeichencode. Ohne Letzteres wäre der angekündigte Light-Modus keine
      # Wertetabelle mehr, sondern wieder Nacharbeit in vier Dateien.
      - run: npm run check:diagramm-farben
      # Die Figuren-Vielfalt hängt an einem Hash über die Element-id, der auf
      # Feldplätze zeigt. Wer SKIN oder HAAR umsortiert, gibt jedem
      # bestehenden Kind ein anderes Gesicht — ohne dass sich ein Datensatz
      # ändert und ohne dass der Typecheck etwas merkt.
      - run: npm run check:figuren
      # KI-Zugang (Story #142): die TS-Zwillinge der Grenzen (600 Aufrufe je
      # Stunde in ki_aufruf_zaehlen, CHECK kzn_name_laenge), das Werkzeug
      # «vokabular» vollständig gegen vocab.ts, und dass Suchfilter nur
      # Enum-Werte annehmen — freie Strings landeten sonst im PostgREST-`or=`.
      - run: npm run check:ki-zugang
      # Fachkern (Epic #190): die Zielblock-Regel samt Pflichttext «Im
      # Kinderfussball-Hauptteil ist die Hauptteilkategorie Pflicht» (#192
      # NFR 4), die Übersetzung von DB-Fehlern (wortgleich mit der
      # Oberfläche), und zwei Wächter: kein "use server" und kein next/ in
      # lib/kern — eine Kern-Funktion nimmt die userId als Parameter und wäre
      # als Server Action ein offener Endpunkt —, dazu eindeutige
      # snake_case-Namen im Werkzeugsatz.
      - run: npm run check:kern
      # Hinweise an den KI-Assistenten (Story #195): dieselben Hinweise wie im
      # Editor, je Variante, wortgleich — die Textkonstanten gegen die früheren
      # JSX-Literale, und dass die Komponenten keine eigenen Literale mehr tragen.
      - run: npm run check:hinweise
      # Material aus dem Diagramm (Epic #266): der Katalog gegen Symbol-Register
      # und SQL-Suchfunktion, dazu Vorschlag, Normalform und Gesamtliste.
      - run: npm run check:material
      # Freitext mit einfachen Listen (Story #282): Regeln für Ablauf und
      # Varianten, dazu die Listenzeichen der SQL-Suchfunktion.
      - run: npm run check:freitext
      # Feedback-Dialog (Epic #541): Das Produktwissen reist als generiertes
      # Modul mit (Vercel baut nur web/) — es muss docs/feedback-triage.md
      # entsprechen. Dazu die Grenzen und ihr SQL-Zwilling.
      - run: npm run gen:feedback-wissen && git diff --exit-code lib/feedback/wissen.ts
      - run: npm run check:feedback

  migrations:
    name: Migrationen + Seed (Wegwerf-DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2
        with:
          # Fest gepinnt (gleiche Version in deploy.yml und deploy-staging.yml):
          # «latest» zog am 2026-11-02 still die CLI v3, die [inbucket] ablehnt
          # und bei 'db push' ohne --remote die lokale DB anpeilt. Wechsel auf v3
          # nur bewusst, samt Anpassung der Deploy-Befehle.
          version: 2.122.1
      # 'supabase start' fährt den vollen lokalen Stack hoch und wendet alle
      # Migrationen + seed.sql an -> schlägt fehl, wenn eine Migration kaputt ist
      # und validiert so die Schema-Änderungen wirklich.
      - name: Lokalen Stack starten und Migrationen + seed.sql anwenden
        run: supabase start
      # psql-Tests (supabase/tests/run.sh): Ortsprüfung, Rennen über dblink,
      # Sync-Bausteine. run.sh lässt nur lokale Ziele zu. Dazu vor_restore.sql
      # wie im Sync über stdin (zurückgerollt): muss still bleiben, also ohne
      # die Tabellenliste im Log.
      - name: psql-Tests gegen Wegwerf-DB
        run: |
          eval "$(supabase status -o env)"
          supabase/tests/run.sh "$DB_URL"
          LISTE=$(psql "$DB_URL" -X -t -A -c "select string_agg(tablename, ' ') from pg_tables where schemaname = 'public'")
          if ! AUSGABE=$({ echo 'begin;'; cat supabase/sync/vor_restore.sql; echo 'rollback;'; } \
                 | psql "$DB_URL" -X --quiet -v ON_ERROR_STOP=1 -v public_tables="$LISTE" 2>&1) \
             || [ -n "$AUSGABE" ]; then
            echo "::error::vor_restore.sql über stdin fehlgeschlagen oder nicht still: $AUSGABE"
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Seed-Env aus dem lokalen Stack übernehmen
        run: |
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      # Manual-Seed gegen die Wegwerf-DB: prüft auf JEDEM PR den Seed-Runtime
      # (Node/supabase-js — sonst bricht seed-prod erst im Ernstfall) UND dass
      # alle YAML-Daten sämtliche Constraints erfüllen (z. B. Hauptteilkategorie).
      - name: Manual-Seed gegen Wegwerf-DB
        working-directory: web
        run: |
          npm ci
          npm run seed
      # Fachkern gegen die echte Datenbank (Epic #190): zwei Wegwerf-Konten,
      # ein Nutzer-Client wie beim KI-Zugang (Bearer, RLS wirkt), dann
      # Zuordnen, Positionen je Variante, Dauer im Auffangen, Kategorien,
      # Übungsfolge samt RPC-Markern, Entfernen, und «nicht gefunden» gegen
      # «keine Rechte» an einem fremden öffentlichen Training. Braucht die
      # Manual-Übungen aus dem Schritt davor.
      - name: Fachkern gegen Wegwerf-DB
        working-directory: web
        run: npm run check:kern-db

  # Prod-Weg der Vereine-Migrationen (Architekturplan Vereine §6.7), nur bis
  # zum Release; danach entfernt ihn ein Aufräum-PR samt supabase/tests/prodweg/.
  # Die CI prüft Migrationen sonst nur gegen eine leere DB. Hier: Schema auf
  # den Stand der letzten Migration auf main, synthetischer Bestand im alten
  # Schema (mit echten Triggern), dann die neuen Migrationen wie `db push` auf
  # Prod und die Prüfabfragen samt Gleichwertigkeit der Lesepfade.
  prodweg:
    name: Prod-Weg (Migrationskette auf Altbestand)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2
        with:
          # Fest gepinnt wie im Job «migrations» und in den Deploy-Workflows.
          version: 2.122.1
      # Der Schrägstrich hinter migrations/ ist nötig: ohne ihn listet
      # ls-tree nur den Ordner selbst.
      - name: Letzte Migration auf main ermitteln
        run: |
          git fetch --depth=1 origin main:refs/remotes/origin/main
          V=$(git ls-tree --name-only origin/main supabase/migrations/ | sort | tail -1 | xargs basename | cut -d_ -f1)
          test -n "$V"
          echo "Letzte Migration auf main: $V"
          echo "PRODWEG_VERSION=$V" >> "$GITHUB_ENV"
      - name: Lokalen Stack starten
        run: supabase start
      - name: Schema auf den Stand von main zurücksetzen
        run: supabase db reset --version "$PRODWEG_VERSION"
      # Das Konto der Verwaltung ist der Default von vereine_nachziehen in der
      # Fundament-Migration; der Bestand legt es bestätigt an, damit der
      # Backfill wie auf Prod genau eine Verwaltung einsetzt.
      - name: Bestand im alten Schema
        run: |
          eval "$(supabase status -o env)"
          KONTO=$(sed -n "s/.*p_verwaltung uuid default '\([0-9a-f-]*\)'::uuid.*/\1/p" \
                    supabase/migrations/20261113100000_vereine_fundament.sql)
          test -n "$KONTO"
          psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -v verwaltung_konto="$KONTO" \
            -f supabase/tests/prodweg/prodweg_bestand.sql
      - name: Neue Migrationen anwenden
        run: supabase migration up
      - name: Prüfabfragen
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f supabase/tests/prodweg/prodweg_pruefen.sql
