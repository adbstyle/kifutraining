name: PR Checks

on:
  pull_request:
    paths:
      - "web/**"
      - "supabase/**"
      - ".github/workflows/**"

jobs:
  web:
    name: Typecheck (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run gen:vocab
      - run: npm run typecheck
      # Inhalt der gezeichneten Vorlagen: unbekannte Symbol-Typen/Farben,
      # doppelte IDs, Elemente ausserhalb der Zeichenfläche. parseDiagramm
      # allein würde das durchlassen (Fallback-Rendering).
      - run: npm run check:diagramme
      # Regeln für Gruppen-Bezeichnungen: der TS-Zwilling des Unique-Index
      # tg_name_je_training. Läuft er auseinander, bekommt der Trainer statt
      # einer Meldung am Feld einen Datenbankfehler.
      - run: npm run check:gruppen
      # Regeln für Varianten des Hauptteils: der TS-Zwilling von
      # tv_name_je_training und des CHECK te_variante_genau_bei_hauptteil.
      # Läuft er auseinander, blendet der Editor erfasste Übungen aus.
      - run: npm run check:varianten
      # Farbpalette: der TS-Zwilling des @theme-Blocks in app/globals.css plus
      # die Kontrastrechnung nach WCAG 2.1 und der Wächter über die alte
      # Palette. Tailwind v4 meldet unbekannte Utilities nicht — eine vergessene
      # Klasse erzeugt still keine Regel, und der Text erbt die Elternfarbe.
      - run: npm run check:farben
      # Farbsätze des Feld-Diagramms: Vollständigkeit der Rollen in beiden
      # Sätzen (Bildschirm und Papier), Kontrast 3:1 nach WCAG 1.4.11 für
      # gezeichnete Gegenstände, und das Verbot roher Farbwerte im
      # Zeichencode. Ohne Letzteres wäre der angekündigte Light-Modus keine
      # Wertetabelle mehr, sondern wieder Nacharbeit in vier Dateien.
      - run: npm run check:diagramm-farben
      # Die Figuren-Vielfalt hängt an einem Hash über die Element-id, der auf
      # Feldplätze zeigt. Wer SKIN oder HAAR umsortiert, gibt jedem
      # bestehenden Kind ein anderes Gesicht — ohne dass sich ein Datensatz
      # ändert und ohne dass der Typecheck etwas merkt.
      - run: npm run check:figuren
      # KI-Zugang (Story #142): die TS-Zwillinge der Grenzen (600 Aufrufe je
      # Stunde in ki_aufruf_zaehlen, CHECK kzn_name_laenge), das Werkzeug
      # «vokabular» vollständig gegen vocab.ts, und dass Suchfilter nur
      # Enum-Werte annehmen — freie Strings landeten sonst im PostgREST-`or=`.
      - run: npm run check:ki-zugang
      # Fachkern (Epic #190): die Zielblock-Regel samt Pflichttext «Im
      # Kinderfussball-Hauptteil ist die Hauptteilkategorie Pflicht» (#192
      # NFR 4), die Übersetzung von DB-Fehlern (wortgleich mit der
      # Oberfläche), und zwei Wächter: kein "use server" und kein next/ in
      # lib/kern — eine Kern-Funktion nimmt die userId als Parameter und wäre
      # als Server Action ein offener Endpunkt —, dazu eindeutige
      # snake_case-Namen im Werkzeugsatz.
      - run: npm run check:kern
      # Hinweise an den KI-Assistenten (Story #195): dieselben Hinweise wie im
      # Editor, je Variante, wortgleich — die Textkonstanten gegen die früheren
      # JSX-Literale, und dass die Komponenten keine eigenen Literale mehr tragen.
      - run: npm run check:hinweise
      # Material aus dem Diagramm (Epic #266): der Katalog gegen Symbol-Register
      # und SQL-Suchfunktion, dazu Vorschlag, Normalform und Gesamtliste.
      - run: npm run check:material

  migrations:
    name: Migrationen + Seed (Wegwerf-DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - name: Lokalen Stack starten und Migrationen + seed.sql anwenden
        run: supabase start
      # 'supabase start' fährt den vollen lokalen Stack hoch und wendet alle
      # Migrationen + seed.sql an -> schlägt fehl, wenn eine Migration kaputt ist
      # und validiert so die Schema-Änderungen wirklich.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Seed-Env aus dem lokalen Stack übernehmen
        run: |
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      # Manual-Seed gegen die Wegwerf-DB: prüft auf JEDEM PR den Seed-Runtime
      # (Node/supabase-js — sonst bricht seed-prod erst im Ernstfall) UND dass
      # alle YAML-Daten sämtliche Constraints erfüllen (z. B. Hauptteilkategorie).
      - name: Manual-Seed gegen Wegwerf-DB
        working-directory: web
        run: |
          npm ci
          npm run seed
      # Fachkern gegen die echte Datenbank (Epic #190): zwei Wegwerf-Konten,
      # ein Nutzer-Client wie beim KI-Zugang (Bearer, RLS wirkt), dann
      # Zuordnen, Positionen je Variante, Dauer im Auffangen, Kategorien,
      # Übungsfolge samt RPC-Markern, Entfernen, und «nicht gefunden» gegen
      # «keine Rechte» an einem fremden öffentlichen Training. Braucht die
      # Manual-Übungen aus dem Schritt davor.
      - name: Fachkern gegen Wegwerf-DB
        working-directory: web
        run: npm run check:kern-db
