name: PR Checks

on:
  pull_request:
    paths:
      - "web/**"
      - "supabase/**"
      - ".github/workflows/**"

jobs:
  web:
    name: Typecheck (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run gen:vocab
      - run: npm run typecheck
      # Inhalt der gezeichneten Vorlagen: unbekannte Symbol-Typen/Farben,
      # doppelte IDs, Elemente ausserhalb der Zeichenfläche. parseDiagramm
      # allein würde das durchlassen (Fallback-Rendering).
      - run: npm run check:diagramme
      # Regeln für Gruppen-Bezeichnungen: der TS-Zwilling des Unique-Index
      # tg_name_je_training. Läuft er auseinander, bekommt der Trainer statt
      # einer Meldung am Feld einen Datenbankfehler.
      - run: npm run check:gruppen
      # Regeln für Varianten des Hauptteils: der TS-Zwilling von
      # tv_name_je_training und des CHECK te_variante_genau_bei_hauptteil.
      # Läuft er auseinander, blendet der Editor erfasste Übungen aus.
      - run: npm run check:varianten
      # Farbpalette: der TS-Zwilling des @theme-Blocks in app/globals.css plus
      # die Kontrastrechnung nach WCAG 2.1 und der Wächter über die alte
      # Palette. Tailwind v4 meldet unbekannte Utilities nicht — eine vergessene
      # Klasse erzeugt still keine Regel, und der Text erbt die Elternfarbe.
      - name: Farben und Kontraste prüfen
        run: npm run check:farben

  migrations:
    name: Migrationen + Seed (Wegwerf-DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - name: Lokalen Stack starten und Migrationen + seed.sql anwenden
        run: supabase start
      # 'supabase start' fährt den vollen lokalen Stack hoch und wendet alle
      # Migrationen + seed.sql an -> schlägt fehl, wenn eine Migration kaputt ist
      # und validiert so die Schema-Änderungen wirklich.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Seed-Env aus dem lokalen Stack übernehmen
        run: |
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      # Manual-Seed gegen die Wegwerf-DB: prüft auf JEDEM PR den Seed-Runtime
      # (Node/supabase-js — sonst bricht seed-prod erst im Ernstfall) UND dass
      # alle YAML-Daten sämtliche Constraints erfüllen (z. B. Hauptteilkategorie).
      - name: Manual-Seed gegen Wegwerf-DB
        working-directory: web
        run: |
          npm ci
          npm run seed
