name: Reset Staging (Schema auf main, manuell)

# Setzt das Schema der STAGING-Datenbank auf den Stand von main zurück:
# Generalprobe des Prod-Wegs im Epic Vereine (AP §6.2).
#
# Schutz gegen ein falsches Ziel: Der Access-Token gilt fürs ganze
# Supabase-Konto, also auch für Prod. Ziel ist darum nur, was diese Datei
# auswählt: ausschliesslich Staging-Secrets (die PR-Checks prüfen per grep,
# dass kein Prod-Secret vorkommt) und die feste Staging-Ref unten, mit der
# Secret und verknüpftes Projekt übereinstimmen müssen.
#
# Was `supabase db reset --linked` laut Quelltext der CLI v2.122.1 tut
# (apps/cli/src/command-internal/drop-objects.ts, ein DO-Block, dann alle
# Migrationen des Checkouts und supabase/seed.sql):
# - löscht alle Funktionen, Views, Tabellen, Sequenzen und Typen in `public`
#   und baut `public` aus den Migrationen neu auf. Danach ist `public` LEER.
# - leert alle Tabellen in `auth` (ausser schema_migrations): ALLE KONTEN SIND
#   WEG, auch Testkonten. Sitzungen und KI-Zugänge ebenso.
# - löscht eigene Schemas, nicht verwaltete Extensions (u. a. pg_trgm,
#   unaccent, pg_cron samt Jobs) und alle RLS-Policies der ganzen Datenbank,
#   auch die auf storage.objects; die Migrationen legen sie wieder an.
# - leert supabase_migrations und schreibt die Historie neu.
# Was laut Quelltext bleibt (bestätigt erst der Probelauf):
# - Storage: Buckets, Objekt-Metadaten und Dateien. Der Reset leert keine
#   storage-Tabelle; Schemas im Besitz von supabase_admin löscht er nicht
#   (dass `storage` auf Staging supabase_admin gehört, ist nicht geprüft).
# - die Auth-Einstellungen im Dashboard (Site URL, Redirects, E-Mail-Vorlagen):
#   sie liegen nicht in der Datenbank.
#
# Danach braucht Staging einen Sync (sync-staging.yml), sonst ist es leer.
#
# Auslösen: GitHub bietet workflow_dispatch erst an, wenn diese Datei auf dem
# Default-Branch (main) liegt. Danach lässt sich der Workflow für jeden Branch
# auslösen, der die Datei enthält — mit der Fassung jenes Branches und
# denselben Repo-Secrets. Der Ref-Guard unten steht in derselben Datei und
# schützt davor nicht. Die Härtung dagegen ist Issue #607.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Zum Bestätigen "reset" eintippen (löscht ALLE Staging-Daten samt Konten)'
        required: true

permissions:
  contents: read

# Dieselbe Gruppe wie deploy-staging.yml und sync-staging.yml: Läufe auf der
# Staging-DB warten aufeinander, statt sich zu überschneiden. GitHub hält je
# Gruppe einen laufenden und einen wartenden Lauf; ein neu wartender ersetzt
# einen älteren wartenden.
concurrency:
  group: staging-db
  cancel-in-progress: false

jobs:
  reset:
    name: supabase db reset --linked (Staging)
    runs-on: ubuntu-latest
    env:
      # Bekannte Ref des Staging-Projekts (steht schon im öffentlichen Repo,
      # kein Geheimnis). Die Prod-Ref gehört nicht in diese Datei.
      STAGING_REF_FEST: lcxxfugtuazsqcahrqou
    steps:
      # Exakter Vergleich in der Shell: `!=` in GitHub-Ausdrücken ignoriert
      # Gross-/Kleinschreibung.
      - name: Bestätigung prüfen
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if ! [ "$CONFIRM" = "reset" ]; then
            echo '::error::Abgebrochen: Input "confirm" muss exakt "reset" sein.'
            exit 1
          fi

      # Der Reset soll das Schema von main herstellen, nie das eines anderen
      # Branches. Deshalb hart abbrechen, wenn nicht von main ausgelöst, und
      # main ausdrücklich auschecken.
      - name: Ref-Guard (nur main)
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::reset-staging läuft nur vom main-Branch (aktuell: $GITHUB_REF). Beim Auslösen 'Use workflow from: main' wählen."
          exit 1

      # Vor jedem CLI-Schritt gegen das Projekt: Das Secret muss genau die
      # feste Staging-Ref tragen.
      - name: Staging-Ref prüfen
        env:
          SUPABASE_STAGING_REF: ${{ secrets.SUPABASE_STAGING_REF }}
        run: |
          if [ "$SUPABASE_STAGING_REF" != "$STAGING_REF_FEST" ]; then
            echo "::error::SUPABASE_STAGING_REF ist nicht die feste Staging-Ref $STAGING_REF_FEST. Abbruch vor jedem Schritt gegen ein Projekt."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: supabase/setup-cli@v2
        with:
          version: 2.122.1

      - name: Mit Staging-Projekt verknüpfen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
        run: supabase link --project-ref "$STAGING_REF_FEST"

      # Die CLI v2.122.1 liest die verknüpfte Ref aus supabase/.temp/project-ref
      # (command-internal/legacy-project-state.paths.ts). SUPABASE_PROJECT_ID
      # ginge der Verknüpfung vor (config/remote-target.layer.ts) und darf darum
      # nicht gesetzt sein.
      - name: Verknüpftes Projekt prüfen (nur Staging)
        env:
          SUPABASE_STAGING_REF: ${{ secrets.SUPABASE_STAGING_REF }}
        run: |
          if [ -n "${SUPABASE_PROJECT_ID:-}" ]; then
            echo "::error::SUPABASE_PROJECT_ID ist gesetzt und ginge der Verknüpfung vor."
            exit 1
          fi
          IST="$(cat supabase/.temp/project-ref 2>/dev/null || true)"
          if [ "$IST" != "$STAGING_REF_FEST" ] || [ "$IST" != "$SUPABASE_STAGING_REF" ]; then
            echo "::error::Verknüpftes Projekt ist nicht Staging ($STAGING_REF_FEST). Abbruch vor dem Reset."
            exit 1
          fi
          echo "Verknüpft mit dem Staging-Projekt $STAGING_REF_FEST."

      - name: Stand des Checkouts ins Log
        run: |
          ANZAHL=$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)
          LETZTE=$(find supabase/migrations -maxdepth 1 -name '*.sql' -exec basename {} \; | LC_ALL=C sort | tail -n 1)
          echo "main @ $(git rev-parse --short HEAD): $ANZAHL Migrationen, letzte: $LETZTE"

      # --yes ist der globale Schalter der CLI für Rückfragen
      # (command-internal/global-flags.ts) und beantwortet «Do you want to
      # reset the remote database?» mit Ja.
      - name: Staging-Schema zurücksetzen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
        run: supabase db reset --linked --yes
