name: Seed Production (manuell)

# Bewusst nur manuell auslösbar: lädt die Manual-Übungen und Diagramme idempotent
# nach Production. Manual-Daten ändern selten -> kein Auto-Seed bei jedem Deploy.
on:
  workflow_dispatch:

jobs:
  seed:
    name: npm run seed (Production)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run seed
