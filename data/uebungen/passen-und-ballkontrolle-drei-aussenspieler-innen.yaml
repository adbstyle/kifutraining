methodischer_fahrplan:
  offen_starten: Drei gegen drei im Feld, dazu pro Team drei Aussenspieler — die Satelliten
    — rund um das Feld, jederzeit anspielbar. Spielt ein Satellit den Ball direkt
    zurück, bleibt er draussen. Kontrolliert er ihn und dribbelt ins Feld, übernimmt
    der Passgeber seinen Platz aussen.
  ueben:
  - Die Satelliten bewusst einbeziehen, in der Breite wie in der Tiefe, und so zum
    Tor kommen.
  - 'Als Satellit: Ball annehmen, ins Feld eindribbeln und ohne Zögern abschliessen.'
  wetteifern: Welches Team trifft in drei Minuten häufiger?
