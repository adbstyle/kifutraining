  max: 14
material: []
methodischer_fahrplan:
  offen_starten: Im Spiel 3:3 und drei Aussenspieler/innen pro Team können die Kinder
    diese immer anspielen. Spielen sie den Ball direkt zurück, bleiben sie in dieser
    Rolle. Kontrollieren sie den Ball und laufen in das Feld, übernimmt der/die Passgeber/in
    dessen Rolle.
  ueben:
  - Durch Zusammenspiel und geschicktes Einbeziehen der Satelliten (Aussenspieler/innen)
    in der Breite und der Tiefe zum Torerfolg gelangen
  - Als Aussenspieler/innen den Ball kontrolliert ins Feld mitnehmen und entschlossen
    abschliessen
  wetteifern: Welches Team erzielt in 3 Minuten mehr Tore?
