material: []
methodischer_fahrplan:
  offen_starten: Ein Kind von Team Rot startet mit dem Ball ins Feld und spielt einen
    Pass zu einem gegenüberstehenden Kind von Team Weiss. Dieses nimmt den Ball in
    die Abschlusszone mit und schliesst auf das Tor ab. Danach erhält das Kind einen
    weiteren Pass von einem Kind der Gruppe Rot, nimmt ihn aus der Schusszone mit
    und schliesst mit dem zweiten Ballkontakt ausserhalb der Schusszone ab. Beide
    Seiten starten gleichzeitig.
  ueben:
  - Ball kontrolliert in die Schusszone mitnehmen und mit einem präzisen Schuss in
    die freie Ecke abschliessen
  wetteifern: Wer schafft zwei erfolgreiche Torabschlüsse hintereinander? Wer mit
    links und nachher mit rechts?
