material: []
methodischer_fahrplan:
  offen_starten: 'Ein Kind von Rot startet mit Ball ins Feld und passt zum Weissen,
    das ihm gegenübersteht. Das Weisse nimmt ihn in die Schusszone mit und schiesst.
    Gleich darauf kommt ein zweiter Pass von Rot: Diesmal führt das Weisse den Ball
    aus der Schusszone hinaus und schiesst von aussen, spätestens mit dem zweiten
    Kontakt. Beide Feldseiten laufen gleichzeitig.'
  ueben:
  - Den Ball sauber in die Schusszone führen und genau in die offene Ecke schiessen.
  wetteifern: Wer trifft zweimal nacheinander? Wer erst mit links und dann mit rechts?
