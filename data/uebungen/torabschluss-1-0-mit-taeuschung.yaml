methodischer_fahrplan:
  offen_starten: Vor der Abschlusszone steht eine Pylone. Das Kind dribbelt darauf
    zu, überwindet sie mit einer Finte, zieht in die Abschlusszone und schiesst aufs
    Tor. Dann Ball holen und auf der anderen Seite anstellen.
  ueben:
  - Mit Rhythmuswechsel und Körpertäuschung an der Pylone vorbei, schnell in die Abschlusszone
    und abschliessen.
  - Täuschung und Abschluss nach beiden Seiten üben.
