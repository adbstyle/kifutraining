methodischer_fahrplan:
  offen_starten: Die Kinder dribbeln in einem Feld um Reifen (Seen) und Markierkegel
    (Berge). Auf dein Zeichen legen sie den Ball entweder in einen See und nehmen
    einen anderen Ball oder auf einen Berg und nehmen einen anderen Ball.
  ueben:
  - Auf dein Zeichen einen See mit links/rechts und einen Berg mit links/rechts umdribbeln
  - Einen See mit dem linken und einen Berg mit dem rechten Fuss bzw. umgekehrt umdribbeln
  wetteifern: Rufst du «Berg» oder «See», versuchen die Kinder, so rasch wie möglich
    den Ball auf einen Berg oder in einen See zu legen. Welches Team schafft dies
    am schnellsten?
