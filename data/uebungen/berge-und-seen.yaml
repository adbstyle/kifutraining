methodischer_fahrplan:
  offen_starten: 'Im Feld liegen Reifen und stehen Pylonen: Die Reifen sind Seen,
    die Pylonen Berge. Jedes Kind führt seinen Ball dazwischen hindurch. Auf dein
    Signal legt es den Ball ab — in einen See oder oben auf einen Berg — und dribbelt
    mit einem anderen, frei gewordenen Ball weiter.'
  ueben:
  - Auf dein Signal einen See umrunden, dann einen Berg — du sagst, ob mit links oder
    mit rechts.
  - 'Fusswechsel nach Gelände: Seen mit dem linken Fuss umrunden, Berge mit dem rechten.
    Danach umgekehrt.'
  wetteifern: Du rufst «Berg» oder «See». Jedes Kind bringt seinen Ball so schnell
    wie möglich an den passenden Ort. Welches Team hat zuerst alle Bälle abgelegt?
