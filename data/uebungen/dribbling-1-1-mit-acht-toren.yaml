methodischer_fahrplan:
  offen_starten: Zwei Kinder aus Team Rot dribbeln gleichzeitig auf das Feld und passen
    auf die andere Seite zum/r jeweiligen Gegenspieler/in. Danach erfolgt ein 1:1
    auf die beiden Minitore. Erobern die Kinder von Team Rot den Ball zurück, kontern
    sie auf die jeweils gegenüberliegenden Minitore. Tore sind nur in der Abschlusszone
    gültig.
  ueben:
  - Nach einer erfolgreichen Ballkontrolle schnell in Richtung der beiden Minitore
    dribbeln und den/die Gegner/in mit schnellen Richtungswechseln oder gut getimten
    Finten austricksen und erfolgreich abschliessen
  wetteifern: Jedes Kind hat drei Versuche. Wer erzielt mehr Tore?
