methodischer_fahrplan:
  offen_starten: Vier Minitore auf jeder Seite, je zwei davon liegen in einer Abschlusszone.
    Zwei Rote dribbeln gleichzeitig ins Feld und passen zu ihrem jeweiligen Gegenspieler
    auf der anderen Seite. Daraus wird ein Eins gegen Eins auf die zwei Minitore der
    jeweiligen Seite. Holt sich Rot den Ball zurück, kontert es auf die gegenüberliegenden
    Minitore. Ein Treffer zählt nur aus der Abschlusszone.
  ueben:
  - Den Ball kontrollieren, sofort Richtung Minitore ziehen und den Gegenspieler mit
    schnellen Richtungswechseln oder einer im richtigen Moment gesetzten Finte stehen
    lassen — dann abschliessen.
  wetteifern: Drei Versuche pro Kind — wer trifft häufiger?
