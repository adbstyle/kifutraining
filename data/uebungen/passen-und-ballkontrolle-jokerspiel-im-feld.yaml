id: passen-und-ballkontrolle-jokerspiel-im-feld
name: Jokerspiel im Feld
trainingsteil: hauptteil
erscheinungsform:
- spiel-kreativ-gestalten
- ball-entschlossen-erobern
feldtyp: grossfeld
hauptteilkategorie: fussball-spielen-lernen
kategorien:
- E
anzahl_kinder:
  min: 10
  max: 12
material: []
methodischer_fahrplan:
  offen_starten: 4 gegen 4 mit zwei Jokern, die immer für das Team am Ball spielen.
    Alle Kinder greifen mit an.
  ueben:
  - 'Am Ball die Blume öffnen: breit und tief aufstellen, die Überzahl im Zusammenspiel
    nutzen.'
  - 'Nach Ballverlust die Blume schliessen: zusammenrücken und den Ball im Schwarm
    jagen.'
  wetteifern: Welches Team trifft in fünf Minuten häufiger?
varianten: []
quelle:
  datei: Manual_Kinderfussball_D.pdf
  seite: 73
