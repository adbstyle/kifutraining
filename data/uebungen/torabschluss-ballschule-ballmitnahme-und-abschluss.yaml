methodischer_fahrplan:
  offen_starten: 'Nach einem diagonalen Pass nimmt ein Kind den Ball nach vorne mit
    und schliesst möglichst mit dem zweiten Ballkontakt ab. Danach holt es den Ball
    und schliesst beim Start an. Variation: Das Kind lässt den Ball prallen und sucht
    den Abschluss frontal.'
  ueben:
  - Ball kontrolliert nach vorne mitnehmen
  - Vor dem Schiessen freie Ecke erkennen (Foto vom Tor) und dorthin zielen
  wetteifern: Gelingt nach jedem zweiten Versuch ein fehlerfreier und erfolgreicher
    Torabschluss?
