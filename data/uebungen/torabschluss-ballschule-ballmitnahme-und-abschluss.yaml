methodischer_fahrplan:
  offen_starten: 'Der Ball kommt per diagonalem Pass. Das Kind nimmt ihn nach vorn
    mit und schiesst, wenn möglich schon mit dem zweiten Kontakt. Dann Ball holen
    und hinten anstellen. Variante: den Pass prallen lassen und frontal abschliessen.'
  ueben:
  - Den Ball kontrolliert nach vorn mitnehmen.
  - Vor dem Schuss die offene Ecke sehen — Foto im Kopf — und sie anvisieren.
  wetteifern: Klappt jeder zweite Versuch fehlerfrei und mit Treffer?
