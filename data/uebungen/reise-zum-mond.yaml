methodischer_fahrplan:
  offen_starten: 'Das Feld ist ein Universum: blaue Reifen sind Planeten, gelbe Teller
    sind Monde, die Minitore am Rand sind Sterne. Die Kinder dribbeln durchs Weltall
    und erfüllen deine Aufgaben — nur um Planeten kreisen, nur Monde umrunden, oder
    in einer Raketenkette hintereinander fliegen.'
  ueben:
  - Eine Runde durchs Universum nur mit dem linken Fuss, die nächste nur mit dem rechten.
  - Bei jedem Ballkontakt den Fuss wechseln.
  - Je eine Runde mit Vollspann, Innenseite und Aussenseite.
  - Ein Kind zeigt einen Trick vor, die anderen fliegen ihn nach.
  wetteifern: 'Sternenschiessen: Wer trifft in zwei Minuten die meisten Sterne? Nach
    jedem Schuss holt das Kind seinen Ball, dribbelt zurück zu einem Mond, umrundet
    unterwegs einen Planeten und sucht sich den nächsten Stern.'
