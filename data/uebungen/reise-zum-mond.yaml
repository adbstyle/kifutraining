methodischer_fahrplan:
  offen_starten: 'Die Kinder dribbeln durch das Universum und erfüllen gleichzeitig
    verschiedene Aufgaben, z. B.: nur um die blauen Reifen (Planeten) bzw. um die
    gelben Markierungsteller (Monde) dribbeln oder einander folgen.'
  ueben:
  - Den Ball nur mit links, dann nur mit rechts führen
  - Den Ball abwechslungsweise mit links und rechts führen
  - Nur mit Voll-, Innen- und Aussenrist führen
  - Jemandem einen Trick vorzeigen und die andern nachahmen lassen
  wetteifern: Sternenschiessen – wer schiesst in zwei Minuten möglichst viele Tore
    (Sterne)? Nach jedem Schuss holen die Kinder den Ball, führen ihn auf den Mond
    zurück, dribbeln um einen Gegenstand im Universum und suchen ein neues Tor (Stern).
