methodischer_fahrplan:
  offen_starten: Mehrere Dreiecke sind mit Pylonen abgesteckt, mindestens eines mehr,
    als es Teams gibt. Du bildest drei Teams und schickst jedes in ein eigenes Dreieck,
    wo alle mit Ball dribbeln. Auf dein Signal zieht jedes Team geschlossen in ein
    freies Dreieck um.
  ueben:
  - Im Dreieck nur mit dem linken Fuss dribbeln und passen, dann nur mit dem rechten.
  - Bei jedem Kontakt den Fuss wechseln.
  - Je einen Durchgang mit Vollspann, Innenseite und Aussenseite.
  wetteifern: 'Welches Team ist beim Signal zuerst vollzählig in einem freien Dreieck?
    Anspruchsvoller: Welches Team hat zuerst alle anderen Dreiecke besucht und steht
    wieder in seinem Startdreieck?'
