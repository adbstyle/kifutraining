  max: 8
material: []
methodischer_fahrplan:
  offen_starten: 'Drei gegen drei mit vier Toren in den Ecken, je zwei blaue und zwei
    gelbe, diagonal gegenüber. Rot spielt auf die blauen Tore und verteidigt die gelben,
    Weiss umgekehrt. Variante: Nach jedem Treffer wechseln die zugeteilten Tore.'
  ueben:
  - Den Kopf oben behalten, beide eigenen Tore im Blick — und das andere Team mit
    schnellen Richtungswechseln auf dem falschen Fuss erwischen.
  wetteifern: Welches Team trifft in beide seiner Tore?
varianten: []
