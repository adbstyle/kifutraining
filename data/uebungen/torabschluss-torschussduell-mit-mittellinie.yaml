material: []
methodischer_fahrplan:
  offen_starten: Zwei Kinder versuchen, in Überzahl ein Tor zu erzielen. In der eigenen
    Platzhälfte darf nur der/die Torspieler/in verteidigen.
  ueben:
  - Mutig nach vorne dribbeln, freilaufen (in die Sonne) und zusammenspielen
  - Entschlossen abschliessen
  - Als Torspieler/in wie eine Katze springen und sich alle Bälle krallen
  wetteifern: Welches Team schafft innerhalb von fünf Minuten am meisten Tore? Welche/r
    Torspieler/in krallt sich die meisten Bälle?
