id: torabschluss-torschussduell-mit-mittellinie
name: Torschussduell mit Mittellinie
trainingsteil: hauptteil
erscheinungsform:
- mutig-tore-erzielen
- mutig-tore-verhindern
feldtyp: grossfeld
hauptteilkategorie: fussball-spielen-lernen
kategorien:
- F
- E
anzahl_kinder:
  min: 4
  max: 6
material: []
methodischer_fahrplan:
  offen_starten: Zwei gegen zwei mit einer Mittellinie. In der eigenen Hälfte darf
    einzig der Torspieler verteidigen — die Feldspieler dürfen sich also im Angriff
    auf ihre Überzahl verlassen.
  ueben:
  - Mutig nach vorn dribbeln, in die Sonne laufen und zusammenspielen.
  - Entschlossen abschliessen.
  - Als Torspieler springen wie eine Katze und sich jeden Ball krallen.
  wetteifern: Welches Team trifft in fünf Minuten am häufigsten? Und welcher Torspieler
    hat am Ende die meisten Bälle gekrallt?
