material: []
methodischer_fahrplan:
  offen_starten: Drei gegen drei, auf jeder Seite zwei Minitore mit einer Abschlusszone
    davor. Der Torspieler jedes Teams darf innerhalb dieser Zone die Hände einsetzen.
  ueben:
  - Das Spiel schnell verlagern, die Breite nutzen und aufs freie Minitor abschliessen.
  - Als Torspieler flink zwischen beiden Minitoren hin- und herschieben.
  wetteifern: Welcher Torspieler kassiert am wenigsten Treffer?
