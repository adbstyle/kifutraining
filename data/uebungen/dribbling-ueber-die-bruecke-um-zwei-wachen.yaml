methodischer_fahrplan:
  offen_starten: Auf der Brücke zwischen den beiden Zonen stehen diesmal zwei Wachen.
    Die Kinder dribbeln an beiden vorbei und bringen den Ball in der Zone gegenüber
    zum Stehen. Erobert eine Wache den Ball oder spielt ihn ins Aus, tauschen die
    beiden die Rollen.
  ueben:
  - Die Wache antäuschen und, wenn es eng wird, den Ball mit dem Körper abschirmen.
  wetteifern: Wer schafft an den zwei Wachen vorbei die meisten Überquerungen? Welcher
    Wache gelingen in einer Minute die meisten Fänge?
