methodischer_fahrplan:
  offen_starten: Zwischen zwei Kindern steht ein Pylonentor. Das eine spielt den Ball
    flach durch das Tor, das andere nimmt ihn dahinter an und spielt ihn von dort
    durch das Tor zurück.
  ueben:
  - Beim Pass den Fuss fest anspannen, ruhig halten und rund 90 Grad nach aussen drehen
    — wie ein Golfschläger.
  - Vor dem Pass kurz zum Mitspieler schauen, ein Foto machen, dann flach spielen,
    sodass der Ball zum Empfänger hin rollt.
  wetteifern: Wie viele Pässe gelingen den zwei in einer Minute?
