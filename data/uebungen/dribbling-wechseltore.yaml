methodischer_fahrplan:
  offen_starten: Zwei Teams spielen 3:3. Dribbelt ein Kind über die Mittellinie, kann
    es in dieser Hälfte ein Tor erzielen. Dribbelt es wieder zurück, sind die anderen
    beiden Tore freigeschaltet. Bei Ballgewinn müssen die Kinder zuerst über die Mittellinie
    dribbeln.
  ueben:
  - Täuschen und in den freien Raum dribbeln
  - Als Mitspieler/innen freilaufen, anspielbar sein und einander zupassen
  wetteifern: Welches Team erzielt innerhalb von fünf Minuten mehr Tore? Welchem Team
    gelingt ein gutes Zusammenspiel?
