id: dribbling-wechseltore
name: Wechseltore
trainingsteil: hauptteil
erscheinungsform:
- spiel-kreativ-gestalten
- ball-entschlossen-erobern
feldtyp: kleinfeld
hauptteilkategorie: fussball-spielen-lernen
kategorien:
- F
- E
anzahl_kinder:
  min: 6
  max: 8
material: []
methodischer_fahrplan:
  offen_starten: 'Drei gegen drei, das Feld hat eine Mittellinie und in jeder Hälfte
    zwei Tore. Abschliessen darf nur, wer zuvor mit dem Ball die Mittellinie überquert
    hat — und zwar auf die Tore der Hälfte, in der es gerade steht. Kehrt das Kind
    in die andere Hälfte zurück, öffnen sich stattdessen deren zwei Tore. Nach einem
    Ballgewinn gilt dasselbe: zuerst die Mittellinie überqueren.'
  ueben:
  - Den Gegner antäuschen und den offenen Raum anlaufen.
  - Ohne Ball freilaufen, sich anbieten und den Ball weitergeben.
  wetteifern: Welches Team trifft in fünf Minuten häufiger? Und welches spielt dabei
    am besten zusammen?
varianten: []
quelle:
  datei: Manual_Kinderfussball_D.pdf
  seite: 65
