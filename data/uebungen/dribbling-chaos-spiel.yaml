material: []
methodischer_fahrplan:
  offen_starten: Auf einer Seite stehen drei Tore. Alle Kinder starten gleichzeitig
    mit Ball von der anderen Seite und dribbeln durchs Gewusel nach vorn; am Ende
    sucht sich jedes eines der drei Tore aus und schiesst.
  ueben:
  - Mutig nach vorn ziehen und Gegenspieler austricksen — mit Körpertäuschung, Übersteiger
    oder Schere.
  wetteifern: Du bildest zwei Teams. Im Eins gegen Eins versucht jedes Kind, in einem
    der drei Tore zu treffen; jeder Treffer zählt für sein Team.
