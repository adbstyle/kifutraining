methodischer_fahrplan:
  offen_starten: Manual Fussball – Good Practice Bilde zwei Teams. Zwei Kinder von
    Team Rot passen nach vorne zu den angreifenden Kindern. Sobald der Pass erfolgt
    ist, dürfen die verteidigenden Kinder von Team Weiss ins Feld, um die Roten am
    Torerfolg zu hindern. Zwei Kinder von Team Rot versuchen, im 1:1 in eines der
    Minitore zu treffen. Nach zwei Minuten wechseln die Rollen der Teams.
  ueben:
  - Präzise auf Angreifer/in zuspielen
  - Ballkontrolle und Abschirmung beherrschen
  - Mit guter Körpertäuschung zum freien Tor dribbeln und erfolgreich abschliessen
  wetteifern: Schaffen alle Angreifer/innen im gleichen Versuch präzise Zuspiele und
    zwei erfolgreiche Torabschlüsse?
