id: dribbling-1-1-gegner-in-im-ruecken
name: 1:1 Gegner/in im Rücken
trainingsteil: hauptteil
erscheinungsform:
- spiel-kreativ-gestalten
- ball-entschlossen-erobern
feldtyp: kleinfeld
hauptteilkategorie: fussball-spielen-lernen
kategorien:
- F
- E
anzahl_kinder:
  min: 6
  max: 8
material: []
methodischer_fahrplan:
  offen_starten: Du bildest Team Rot und Team Weiss. Zwei Rote stehen hinten und passen
    nach vorn zu ihren beiden Angreifern. Erst wenn der Pass gespielt ist, dürfen
    die Verteidiger von Weiss ins Feld. Die zwei roten Angreifer versuchen im Eins
    gegen Eins, ein Minitor zu treffen. Die Rollen wechseln nach zwei Minuten.
  ueben:
  - Den Pass genau in den Fuss des Angreifers spielen.
  - Den Ball sauber kontrollieren und vor dem Gegner im Rücken abschirmen.
  - Mit einer Körpertäuschung zum freien Tor ziehen und abschliessen.
  wetteifern: 'Gelingt es allen Angreifern im selben Versuch: zwei genaue Zuspiele
    und zwei Treffer?'
varianten: []
quelle:
  datei: Manual_Kinderfussball_D.pdf
  seite: 69
