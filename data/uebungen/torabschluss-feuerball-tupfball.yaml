methodischer_fahrplan:
  offen_starten: In jedem Viereck steht ein Dreierteam zusammen mit einem Eisbären
    des anderen Teams. Die drei spielen sich den Feuerball mit den Händen zu und versuchen,
    den Eisbären damit abzutupfen — berühren, nicht abschiessen. Jede Berührung gibt
    einen Punkt. Wer den Ball in der Hand hält, darf nicht laufen.
  ueben:
  - Schnell zusammenspielen und den Eisbären gemeinsam in eine Ecke drängen.
  wetteifern: Welches Team holt mehr Punkte? Welchem Eisbären gelingt es, sich immer
    wieder freizulaufen?
