material: []
methodischer_fahrplan:
  offen_starten: Ein Dreierteam pro Viereck und ein Eisbär des anderen Teams stellen
    sich auf. Das Dreierteam spielt sich den Ball (Feuerball) mit den Händen so zu,
    dass sie den Eisbären mit dem Ball berühren/abtupfen (nicht abschiessen) können.
    Dafür erhalten sie einen Punkt. Die Kinder dürfen mit dem Ball in der Hand nicht
    laufen.
  ueben:
  - Mit raschem Zusammenspiel und Kooperation den Eisbären in die Ecke drängen
  wetteifern: Welches Team erzielt mehr Punkte? Welcher Eisbär kann sich freilaufen?
