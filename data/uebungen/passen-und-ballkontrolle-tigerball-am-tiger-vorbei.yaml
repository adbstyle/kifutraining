material: []
methodischer_fahrplan:
  offen_starten: Zwei Kinder spielen sich den Ball flach zu und bleiben dabei immer
    anspielbar. Zwischen ihnen lauert der Tiger. Gelingen drei Pässe, ohne dass der
    Tiger dazwischenkommt? Schnappt sich der Tiger den Ball, wird das Kind, das den
    Pass gespielt hat, zum neuen Tiger. Einfacher wird es, wenn eine Pylone den Tiger
    ersetzt.
  ueben:
  - Hinter dem Tiger freilaufen — aus seinem Schatten hinaus in die Sonne.
  wetteifern: Wie viele Pässe kommen am Tiger vorbei?
