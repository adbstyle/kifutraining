methodischer_fahrplan:
  offen_starten: Zwei Kinder befinden sich je in einer Zone und passen sich gegenseitig
    den Ball flach zu. Der Tiger versucht, die Pässe zu unterbinden. Gelingt es, tauschen
    Tiger und passgebendes Kind die Rolle.
  ueben:
  - Geschickt im Rücken des Tigers freilaufen (aus dem Schatten in die Sonne) und
    präzise passen
  wetteifern: Gelingen die Pässe am Tiger vorbei und die Ballannahme in der Zone?
