methodischer_fahrplan:
  offen_starten: Zwei Kinder stehen je in einer eigenen Zone und spielen sich den
    Ball flach zu. Dazwischen lauert der Tiger und will die Pässe abfangen. Gelingt
    es ihm, wird das Kind, das den Pass gespielt hat, zum neuen Tiger.
  ueben:
  - Hinter dem Tiger freilaufen — raus aus dem Schatten, hinein in die Sonne — und
    genau passen.
  wetteifern: Gelingen die Pässe vorbei am Tiger — und die saubere Annahme in der
    Zone?
