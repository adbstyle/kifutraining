methodischer_fahrplan:
  offen_starten: Drei gegen drei ohne Tore. An beiden Enden liegt eine Endzone. Einen
    Punkt gibt es, wenn ein Kind den Ball in der gegnerischen Endzone unter Kontrolle
    stoppt.
  ueben:
  - Mit Mut in die Endzone dribbeln; die Mitspieler laufen sich frei, bieten sich
    an und spielen den Ball weiter.
  - 'Die Blume öffnen und schliessen: Am Ball auseinanderziehen und das Feld breit
    machen, nach Ballverlust sofort zusammenrücken.'
  wetteifern: Welchem Team gelingt der Weg von der einen Endzone in die andere, ohne
    den Ball zu verlieren?
