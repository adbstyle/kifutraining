id: torabschluss-3-3-auf-unterschiedliche-tore
name: 3:3 auf unterschiedliche Tore
trainingsteil: hauptteil
erscheinungsform:
- mutig-tore-erzielen
- mutig-tore-verhindern
feldtyp: kleinfeld
hauptteilkategorie: fussball-spielen-lernen
kategorien:
- F
- E
anzahl_kinder:
  min: 7
  max: 9
material: []
methodischer_fahrplan:
  offen_starten: 'Drei gegen drei auf ungleiche Tore: Weiss spielt auf das grosse
    Tor mit Torspieler, Rot auf zwei Minitore. Sobald Rot in ein Minitor trifft, tauschen
    die Teams die Rollen.'
  ueben:
  - Die Überzahl im Zusammenspiel ausnutzen und aufs grosse Tor abschliessen.
  - Der Torspieler spielt aktiv mit; mit schnellem Angriff aufs Minitor treffen.
  wetteifern: Welches Team trifft ins Minitor und nach dem Wechsel gleich auch ins
    grosse Tor?
varianten: []
quelle:
  datei: Manual_Kinderfussball_D.pdf
  seite: 76
