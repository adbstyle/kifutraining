id: torabschluss-3-3-auf-unterschiedliche-tore
name: 3:3 auf unterschiedliche Tore
trainingsteil: hauptteil
erscheinungsform:
- mutig-tore-erzielen
- mutig-tore-verhindern
feldtyp: kleinfeld
kategorien:
- F
- E
anzahl_kinder:
  min: 6
  max: 6
material: []
methodischer_fahrplan:
  offen_starten: Die Kinder spielen 3:3. Das weisse Team schiesst auf das grosse Tor,
    das rote auf die beiden Minitore. Nach Torerfolg auf die Minitore wechseln die
    Rollen.
  ueben:
  - Durch geschicktes Zusammenspiel Überzahl ausnutzen und auf das grosse Tor abschliessen
  - Durch aktives Mitspielen des Torspielers/ der Torspielerin und rasches Angriffsspiel
    aufs Minitor abschliessen
  wetteifern: Welches Team schafft ein Tor auf die Minitore und nach dem Seitenwechsel
    direkt eines auf das grosse Tor?
varianten: []
