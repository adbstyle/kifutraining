methodischer_fahrplan:
  offen_starten: Rund um ein Startfeld liegen mehrere Felder, jedes mit Pylonen einer
    Farbe markiert. Alle Kinder dribbeln frei im Startfeld. Hebst du eine farbige
    Pylone hoch, dribbeln alle ins Feld mit dieser Farbe.
  ueben:
  - Bis zum nächsten Farbwechsel nur mit dem linken Fuss dribbeln, danach nur mit
    dem rechten.
  - Bei jedem Ballkontakt den Fuss wechseln.
  - 'Drei Farbwechsel lang je eine Fussfläche: Vollspann, Innenseite, Aussenseite.'
  wetteifern: 'Mehrere Teams treten gegeneinander an: Welches ist vollzählig zuerst
    im angezeigten Feld? Schwieriger: Du zeigst zwei oder drei Farben nacheinander
    — die Teams durchdribbeln die Felder in dieser Reihenfolge und kehren dann ins
    Startfeld zurück.'
