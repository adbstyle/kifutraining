id: dribbling-1-1-frontal-auf-zwei-tore
name: 1:1 frontal auf zwei Tore
trainingsteil: hauptteil
erscheinungsform:
- spiel-kreativ-gestalten
- ball-entschlossen-erobern
feldtyp: kleinfeld
hauptteilkategorie: fussball-spielen-lernen
kategorien:
- G
- F
- E
anzahl_kinder:
  min: 6
  max: 8
material: []
methodischer_fahrplan:
  offen_starten: 'Zwei Tore stehen nebeneinander auf einer Seite. Gleichzeitiger Start
    für zwei Kinder: eines mit Ball frontal auf das andere zu, mit dem Ziel, in einem
    der beiden Tore zu treffen, egal welchem. Tor oder Aus beendet die Runde. Nach
    zwei Minuten tauschen die Teams die Rollen.'
  ueben:
  - Mit Tempo und Rhythmuswechsel am Gegner vorbeigehen.
  - 'Die Abschlüsse abwechseln: einmal linker, einmal rechter Fuss.'
  wetteifern: Du bildest zwei Teams. Fürs linke Tor zählen nur Treffer mit dem linken
    Fuss, fürs rechte nur solche mit dem rechten.
varianten: []
