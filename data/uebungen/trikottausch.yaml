aufbau: 'Alle Kinder dribbeln im Feld mit je einem farbigen Überzieher in der Hand.
  Auf dein Zeichen dribbeln sie in das freie, markierte Feld und tauschen ihren Überzieher
  mit einem anderen Kind. Variation: Du schickst nur die Kinder mit einer Farbe ins
  markierte Feld. Oder du gibst vor, welche Kinder tauschen, z. B. Rot zu Gelb, Gelb
  zu Blau, Blau zu Rot.'
ueben:
- Den Ball nur mit links, dann nur mit rechts führen
- Den Ball abwechslungsweise mit links und rechts führen
- Nur mit Voll-, Innen- und Aussenrist führen
wetteifern: Die Kinder mit welcher Farbe durchdribbeln das Feld in der Mitte am schnellsten?
  Welches Farbteam findet sich am schnellsten in der Mitte zusammen?
