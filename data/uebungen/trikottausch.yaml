methodischer_fahrplan:
  offen_starten: 'Jedes Kind dribbelt mit einem farbigen Leibchen in der Hand durch
    das Feld; in der Mitte ist ein kleineres Feld frei markiert. Auf dein Signal dribbeln
    alle ins Mittelfeld und tauschen dort ihr Leibchen mit einem anderen Kind. Du
    kannst die Regel verschärfen: Nur eine Farbe darf hinein — oder du gibst die Tauschkette
    vor, etwa Rot gibt an Gelb, Gelb an Blau, Blau an Rot.'
  ueben:
  - Bis zum nächsten Signal nur mit dem linken Fuss dribbeln, danach nur mit dem rechten.
  - Bei jedem Ballkontakt den Fuss wechseln.
  - Je einen Durchgang mit Vollspann, Innenseite und Aussenseite.
  wetteifern: 'Du rufst eine Farbe: Welche Gruppe hat das Mittelfeld zuerst komplett
    durchquert? Oder: Welches Farbteam hat sich zuerst vollzählig in der Mitte versammelt?'
