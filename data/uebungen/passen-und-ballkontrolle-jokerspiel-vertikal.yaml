methodischer_fahrplan:
  offen_starten: Drei gegen drei; zwei Joker spielen im Feld mit, zwei weitere stehen
    ausserhalb hinter den Toren. Die Joker ausserhalb haben zwei Ballkontakte. Alle
    Kinder greifen mit an.
  ueben:
  - Die Joker im Feld und die hinter den Toren einbeziehen — so entsteht Tiefe und
    Überzahl.
  wetteifern: Ein Treffer, an dem ein Joker in der Tiefe beteiligt war, zählt doppelt.
