methodischer_fahrplan:
  offen_starten: Zwischen zwei Zonen liegt die Brücke, auf ihr stehen Pylonen als
    Hindernisse. Auf dein Signal dribbeln alle Kinder über die Brücke in die gegenüberliegende
    Zone und stoppen dort den Ball. Die Aufgabe auf der Brücke kannst du jedes Mal
    ändern.
  ueben:
  - Den Ball dicht am Fuss um jede Pylone lenken — eine Überquerung linksfüssig, die
    nächste rechtsfüssig.
  wetteifern: Du bildest zwei Teams und gibst eine Route über die Brücke vor. Welches
    Team hat sie zuerst komplett abgefahren?
