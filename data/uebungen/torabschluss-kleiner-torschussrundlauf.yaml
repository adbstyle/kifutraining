methodischer_fahrplan:
  offen_starten: 'Ein Kind dribbelt in eines der Felder und schliesst aufs Tor ab.
    Anschliessend steht es ins Tor und der/die bisherige Torspieler/in stellt sich
    bei der nächsten Schussbahn an. Variation: auf Minitore abschliessen.'
  ueben:
  - Vor dem Schiessen ein Foto vom Tor machen und in die freie Ecke zielen
  - Einmal mit dem linken, einmal mit dem rechten Fuss schiessen
  wetteifern: Wer schafft mit dem linken und dem rechten Fuss ein Tor?
