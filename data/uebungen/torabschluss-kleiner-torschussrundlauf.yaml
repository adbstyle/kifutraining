  max: 11
material: []
methodischer_fahrplan:
  offen_starten: 'Vor einem Tor mit Torspieler liegen mehrere Schussbahnen. Ein Kind
    dribbelt in eine Bahn und schiesst. Danach geht es selbst ins Tor, und der bisherige
    Torspieler stellt sich an der nächsten Schussbahn an. Variante: auf Minitore ohne
    Torspieler.'
  ueben:
  - Vor dem Schuss kurz hinschauen — Foto im Kopf — und die offene Ecke anvisieren.
  - Einen Versuch links schiessen, den nächsten rechts.
  wetteifern: Wer trifft sowohl mit dem linken als auch mit dem rechten Fuss?
varianten: []
