id: dribbling-dribblingtore
name: Dribblingtore
trainingsteil: hauptteil
erscheinungsform:
- spiel-kreativ-gestalten
- ball-entschlossen-erobern
feldtyp: kleinfeld
hauptteilkategorie: fussball-spielen-lernen
kategorien:
- F
- E
anzahl_kinder:
  min: 6
  max: 8
material: []
methodischer_fahrplan:
  offen_starten: 'Drei gegen drei auf einem Feld mit zwei Minitoren pro Seite. Quer
    durch die Mitte verlaufen zwei kurze Linien: Wer mit dem Ball über eine davon
    dribbelt, hat ein Dribbeltor erzielt. Ein Dribbeltor bringt einen Punkt, ein Treffer
    ins Minitor ebenso.'
  ueben:
  - 'Am Ball jedes Mal neu entscheiden: mutig allein durchs Dribbeltor — oder den
    Ball nach vorn zu einem Mitspieler und gemeinsam auf ein Minitor.'
  wetteifern: 'Welches Team sammelt mehr Punkte? Du bestimmst die Wertung: beide Torarten
    gleich, oder eine davon zählt doppelt.'
varianten: []
quelle:
