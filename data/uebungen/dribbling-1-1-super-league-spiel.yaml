methodischer_fahrplan:
  offen_starten: 'Mehrere kleine Felder liegen nebeneinander wie Ligastufen, das Super-League-Feld
    zuoberst. In jedem Feld duellieren sich zwei Kinder eine Minute lang: Wer den
    Ball am anderen vorbei über dessen Torlinie dribbelt, punktet. Der Sieger steigt
    ein Feld auf, der Verlierer ein Feld ab; steht es unentschieden, entscheidet Schere-Stein-Papier.'
  ueben:
  - Den Körper als Schutzschild zwischen Ball und Gegner bringen.
  - Antäuschen, das Tempo wechseln — und den Ball sicher über die Torlinie bringen.
  wetteifern: Wer holt die meisten Super-League-Titel?
