id: passen-und-ballkontrolle-2-1
name: '2:1'
trainingsteil: hauptteil
erscheinungsform:
- spiel-kreativ-gestalten
- ball-entschlossen-erobern
feldtyp: kleinfeld
hauptteilkategorie: fussball-spielen-lernen
kategorien:
- F
- E
anzahl_kinder:
  min: 9
  max: 11
material: []
methodischer_fahrplan:
  offen_starten: Die Kinder spielen im Kleinfeld 2:1. Die rote Linie dient als Grenze.
    Gib diverse Startpositionen (seitlich, nebeneinander, vor dem verteidigenden Kind)
    vor.
  ueben:
  - Situationen schnell einschätzen, in die Sonne laufen (sich freilaufen) und Überzahl
    durch Zusammenspiel ausnutzen
  wetteifern: Zähl z. B. das linke Tor doppelt oder gib für einen erfolgreichen Pass
    (oder Dribbling) einen Extrapunkt.
