anzahl_kinder:
  min: 9
  max: 11
material: []
methodischer_fahrplan:
  offen_starten: Zwei gegen eins auf dem Kleinfeld; eine rote Linie begrenzt den Raum.
    Du gibst vor, wo die drei starten — seitlich, nebeneinander oder direkt vor dem
    Verteidiger.
  ueben:
  - Die Lage schnell lesen, in die Sonne laufen — also raus aus dem Deckungsschatten
    des Verteidigers — und die Überzahl im Zusammenspiel ausnutzen.
  wetteifern: 'Setz Anreize: Das linke Tor zählt doppelt, oder ein gelungener Pass
    beziehungsweise ein gelungenes Dribbling bringt einen Extrapunkt.'
