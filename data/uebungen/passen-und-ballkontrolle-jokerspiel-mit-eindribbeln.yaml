methodischer_fahrplan:
  offen_starten: Drei gegen drei, an der Aussenlinie stehen Joker. Passt ein Feldspieler
    zu einem Joker und der Joker dribbelt hinein ins Feld, übernimmt der Passgeber
    dessen Platz an der Linie.
  ueben:
  - Die Joker in der Breite einbeziehen und über sie zum Tor kommen.
  - 'Als Joker: Ball annehmen, ins Feld eindribbeln und ohne Zögern abschliessen.'
  wetteifern: Welches Team trifft häufiger über einen Joker?
