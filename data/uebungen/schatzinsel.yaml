aufbau: Rufst du «Ahoi, Piraten!», dribbeln die Kinder auf die Schatzinsel in der
  Mitte. Bei «Hejo, Captain Jack!» lassen die Kinder ihren Ball liegen und dribbeln
  mit einem freien Ball weiter.
ueben:
- Den Ball nur mit links, dann nur mit rechts führen
- Abwechslungsweise mit links und rechts führen
- Nur mit Voll-, Innen- und Aussenrist führen
wetteifern: Zwei Teams («Piraten» und «Affen») stehen sich gegenüber, wobei die Affen
  auf der Schatzinsel alle Bälle beherbergen. Die Piraten versuchen, so viele Bälle
  wie möglich dribbelnd auf ihr Piratenschiff zu entführen, die Affen versuchen, dies
  zu verhindern und die Bälle auf der Insel zu behalten. Die Affen können die Bälle
  auch wieder vom Piratenschiff auf die Insel holen. Wer hat nach zwei Minuten mehr
  Bälle?
