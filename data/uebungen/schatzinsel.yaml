methodischer_fahrplan:
  offen_starten: In der Feldmitte liegt die Schatzinsel, ein markiertes Feld. Die
    Kinder dribbeln rundherum im Meer. Rufst du «Ahoi, Piraten!», stürmen alle dribbelnd
    auf die Insel. Rufst du «Hejo, Captain Jack!», lässt jedes Kind seinen Ball liegen,
    schnappt sich einen anderen freien Ball und dribbelt weiter.
  ueben:
  - Im Meer nur mit dem linken Fuss dribbeln, nach dem nächsten Ruf nur mit dem rechten.
  - Bei jedem Ballkontakt den Fuss wechseln.
  - Je einen Durchgang mit Vollspann, Innenseite und Aussenseite.
  wetteifern: 'Zwei Teams: Die Affen hüten sämtliche Bälle auf der Schatzinsel, die
    Piraten wollen sie dribbelnd auf ihr Schiff bringen — ein markiertes Feld am Rand.
    Die Affen wehren ab und dürfen erbeutete Bälle vom Schiff zurück auf die Insel
    holen. Nach zwei Minuten wird gezählt: Wo liegen mehr Bälle?'
