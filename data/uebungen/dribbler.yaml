methodischer_fahrplan:
  offen_starten: Manual Fussball – Good Practice Bilde zwei Teams und ordne sie einem
    markierten Rechteck zu. Auf jeder Seite dribbelt die Hälfte der Kinder von der
    einen Stirnseite zur anderen.
  ueben:
  - Vor einem Markierkegel einen Richtungswechsel machen; danach zur nächsten Markierung
    auf die andere Seite dribbeln; anschliessend neu starten
  - Je eine Runde mit dem Innenrist, mit dem Aussenrist und als Übersteiger machen
    sowie in einer Runde den Ball mit der Sohle zurückziehen und hinter dem Standbein
    durchspielen
  wetteifern: Je ein Kind verteidigt auf der Linie, ein anderes im Viereck. Welches
    schafft den Durchmarsch, ohne dass die Verteidiger/innen es stoppen (Ballverlust)?
