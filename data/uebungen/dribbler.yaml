methodischer_fahrplan:
  offen_starten: Ein Rechteck ist abgesteckt, an seinen Stirnseiten stehen Pylonen.
    Du teilst zwei Teams ein und weist jedem eine Feldhälfte zu. Dort dribbelt jedes
    Kind quer durch seine Hälfte, Stirnseite zu Stirnseite und wieder retour.
  ueben:
  - Kurz vor der Pylone die Richtung wechseln, quer zur nächsten Pylone auf der Gegenseite
    dribbeln und von dort neu starten.
  - 'Jede Runde eine andere Technik am Wendepunkt: mit der Innenseite, mit der Aussenseite,
    als Übersteiger — und einmal die Sohlen-Variante: Ball mit der Sohle zurückholen
    und hinter dem Standbein auf die andere Seite spielen.'
  wetteifern: 'Zwei Kinder werden Verteidiger: eines wacht auf der Linie, eines im
    Feld. Die anderen versuchen den Durchmarsch. Wer kommt auf die andere Seite, ohne
    den Ball zu verlieren?'
