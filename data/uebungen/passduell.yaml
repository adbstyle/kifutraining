methodischer_fahrplan:
  offen_starten: Aussen führt ein Dribbelparcours ums Feld, innen liegt ein Passfeld.
    Ein Team dribbelt aussen durch den Parcours, das andere steht innen paarweise
    zusammen und spielt sich den Ball zu. Danach wechseln die Teams.
  ueben:
  - Aussen nur mit dem linken Fuss dribbeln und innen nur mit links passen — dann
    alles mit rechts.
  - Beim Dribbeln bei jedem Kontakt den Fuss wechseln.
  - 'Drei Durchgänge mit vorgegebener Fussfläche: Vollspann, Innenseite, Aussenseite.'
  - Innen jeden Pass mit genau drei Ballkontakten spielen — annehmen, vorlegen, zuspielen
    — und den Abstand zwischen den Paaren immer wieder verändern.
  wetteifern: Die Paare im Innenfeld zählen ihre Pässe. Wie viele schaffen sie, bis
    das ganze Aussenteam den Parcours einmal durchdribbelt hat? Dann Rollentausch
    und Revanche.
