methodischer_fahrplan:
  offen_starten: Ein Team dribbelt aussen in einem Parcours, während sich das andere
    Team im inneren Feld in Tandems die Bälle zupasst.
  ueben:
  - Den Ball nur mit links, dann nur mit rechts führen und passen
  - Den Ball abwechslungsweise mit links und rechts führen
  - Nur mit Voll-, Innen- und Aussenrist führen
  - Passen und den Ball immer annehmen, vorlegen und zuspielen (drei Kontakte); Distanz
    variieren
  wetteifern: Im inneren Feld passen sich jeweils zwei Kinder den Ball zu. Wie viele
    Pässe schaffen sie, bis alle Kinder den Parcours absolviert haben?
