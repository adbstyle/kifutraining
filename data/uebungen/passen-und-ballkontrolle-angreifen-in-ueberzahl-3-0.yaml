methodischer_fahrplan:
  offen_starten: Drei Rote greifen ohne Gegenspieler auf zwei Tore an. Sie haben fünf
    bis zehn Sekunden für den Abschluss, und alle drei müssen den Ball berührt haben.
    Tor oder Aus beendet den Angriff.
  ueben:
  - Mit genauen Pässen rasch zum Abschluss kommen.
  - Die ganze Breite des Feldes nutzen.
  wetteifern: Weiss startet gleichzeitig von der anderen Seite im Gegenstrom. Welches
    Team trifft zuerst?
