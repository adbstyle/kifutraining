methodischer_fahrplan:
  offen_starten: Alle Kinder dribbeln mit einem Ball auf der Schatzinsel. Auf dein
    Signal wechseln sie die Bälle (idealerweise verschiedene Bälle).
  ueben:
  - Den Ball nur mit links, dann nur mit rechts führen
  - Den Ball abwechslungsweise mit links und rechts führen
  - Nur mit Voll-, Innen- und Aussenrist führen
  - Einen vorgezeigten Trick nachahmen
  - Zusätzliche Ballkünstlertricks ausführen (siehe «Spiel mit dem Feuer»)
  wetteifern: 'Bilde drei Teams. Welches Team hat zuerst seinen Schatz (Bälle) von
    der Insel in seine Schatztruhe gebracht? Variante: Die Teams können den Schatz
    der anderen klauen. Wer hat innerhalb von zwei Minuten mehr Schätze?'
