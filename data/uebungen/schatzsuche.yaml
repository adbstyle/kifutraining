methodischer_fahrplan:
  offen_starten: Alle Kinder dribbeln auf der Schatzinsel, einem markierten Feld;
    ideal sind unterschiedliche Bälle. Auf dein Signal lässt jedes Kind seinen Ball
    liegen und dribbelt mit einem anderen weiter.
  ueben:
  - Bis zum nächsten Signal nur mit dem linken Fuss dribbeln, danach nur mit dem rechten.
  - Bei jedem Ballkontakt den Fuss wechseln.
  - Je einen Durchgang mit Vollspann, Innenseite und Aussenseite.
  - Ein vorgezeigter Trick wird von allen nachgemacht.
  - Zum Schluss Ballkunststücke mit Hand und Fuss, wie sie bei «Spiel mit dem Feuer»
    beschrieben sind.
  wetteifern: Drei Teams, drei Schatztruhen am Rand. Welches Team hat seinen Schatz
    zuerst von der Insel in die eigene Truhe gedribbelt? Als Variante dürfen die Teams
    einander die Schätze aus den Truhen stehlen — wer besitzt nach zwei Minuten mehr?
