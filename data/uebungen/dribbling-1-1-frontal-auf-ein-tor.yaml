  max: 8
material: []
methodischer_fahrplan:
  offen_starten: Beide Kinder versuchen, beim Gegenüber ein Tor zu erzielen. Ist ein
    Ball im Tor oder aus dem Feld, ist das Spiel zu Ende. Nach zwei Minuten wechseln
    die Rollen der Teams.
  ueben:
  - Mutig nach vorne dribbeln sowie die Gegenspieler/innen mit Täuschungen und Finten
    (z. B. Körpertäuschung, Übersteiger, Schere) überwinden
  wetteifern: Bilde zwei Teams. Im ersten Durchgang startet das rote Team mit dem
    Ball, im zweiten Durchgang das weisse Team.
