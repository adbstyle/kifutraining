methodischer_fahrplan:
  offen_starten: Jäger und Hase stehen sich gegenüber. Auf dein Signal rennt der Hase
    los in die Jagdzone, ein markiertes Feld, und im selben Moment startet der Jäger.
    Je nachdem, wie sich der Jäger bewegt, entscheidet der Hase, ob er zum roten oder
    zum gelben Tor sprintet. Der Jäger versucht, ihn mit den Händen zu berühren. Danach
    Rollenwechsel.
  ueben:
  - Den Jäger mit einer Körpertäuschung überraschen und durchs Tor sprinten.
  wetteifern: Welche Hasen sammeln die meisten Punkte? Wie viele Läufe gelingen ohne
    Fang? Welcher Jäger erwischt fünf Hasen?
