id: torabschluss-grosser-torschussrundlauf
name: Grosser Torschussrundlauf
trainingsteil: hauptteil
erscheinungsform:
- mutig-tore-erzielen
- mutig-tore-verhindern
feldtyp: kleinfeld
hauptteilkategorie: fussball-spielen-lernen
kategorien:
- G
- F
- E
anzahl_kinder:
  min: 10
  max: 12
material: []
methodischer_fahrplan:
  offen_starten: Alle Kinder starten gleichzeitig. Sie dribbeln den Ball aus einem
    markierten Viereck heraus und schliessen mit der nächsten Ballberührung in eines
    der acht Tore ab (freie Wahl). Anschliessend holen sie ihren Ball, kehren ins
    Viereck zurück und schiessen auf das nächste freie Tor.
  ueben:
  - Vor dem Schiessen ein Foto vom Tor machen und in die freie Ecke zielen
  wetteifern: Wie viele Tore erzielen die Kinder mit dem linken Fuss und wie viele
    mit dem rechten?
varianten: []
quelle:
