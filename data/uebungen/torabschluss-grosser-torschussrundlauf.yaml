anzahl_kinder:
  min: 10
  max: 12
material: []
methodischer_fahrplan:
  offen_starten: 'In der Mitte liegt ein markiertes Viereck, rundherum stehen acht
    Tore. Gleichzeitiger Start für alle: aus dem Viereck heraus dribbeln und mit der
    allernächsten Berührung auf ein Tor der eigenen Wahl schiessen. Dann Ball holen,
    zurück ins Viereck und das nächste freie Tor anvisieren.'
  ueben:
  - 'Vor dem Schuss kurz hinschauen — ein Foto im Kopf: Wo ist die Ecke offen? — und
    genau dorthin zielen.'
  wetteifern: Wie viele Treffer fallen links, wie viele rechts?
varianten: []
