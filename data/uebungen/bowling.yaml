aufbau: Die Kinder spielen zu zweit; jedes Paar bekommt vier Pylonen und einen Ball.
  Die Pylonen stehen wie Kegel zusammen, ein Kind steht fünf Meter davor mit dem Ball,
  das andere auf der Gegenseite dahinter. Mit einem Pass sollen möglichst viele Pylonen
  fallen; dann ist das andere Kind dran. Wie viele Versuche braucht das Paar, bis
  alle liegen?
