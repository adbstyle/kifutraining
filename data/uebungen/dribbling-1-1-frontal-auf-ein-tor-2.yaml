methodischer_fahrplan:
  offen_starten: Die Kinder duellieren sich 1:1. Das Tor in der Mitte ist grösser
    als die Tore nebenan. Ist ein Ball im Tor oder aus dem Feld, ist das Spiel zu
    Ende. Nach zwei Minuten wechseln die Rollen der Teams.
  ueben:
  - Mit Tempo und Rhythmuswechsel an der/dem Gegner/in vorbeidribbeln
  - Abwechslungsweise mit linkem bzw. rechtem Fuss abschliessen
  wetteifern: Bilde zwei Teams. Das Tor in der Mitte zählt dreifach.
