methodischer_fahrplan:
  offen_starten: Eins gegen Eins auf drei Tore in einer Reihe, das mittlere deutlich
    grösser als die beiden äusseren. Tor oder Aus beendet die Runde. Nach zwei Minuten
    tauschen die Teams die Rollen.
  ueben:
  - Mit Tempo und Rhythmuswechsel am Gegner vorbeigehen.
  - 'Die Abschlüsse abwechseln: einmal linker, einmal rechter Fuss.'
  wetteifern: Du bildest zwei Teams. Ein Treffer ins grosse Mitteltor bringt drei
    Punkte.
