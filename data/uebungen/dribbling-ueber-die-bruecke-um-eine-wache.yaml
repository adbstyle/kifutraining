methodischer_fahrplan:
  offen_starten: Zwischen zwei Zonen liegt die Brücke, ein schmaler Streifen. Auf
    der Brücke steht eine Wache ohne Ball. Die Kinder dribbeln von der einen Zone
    an der Wache vorbei in die gegenüberliegende Zone und stoppen dort den Ball. Gelingt
    der Wache eine Ballberührung, wechselt sie mit diesem Kind die Rolle.
  ueben:
  - Den richtigen Moment abwarten, die Lücke sehen, der Wache ausweichen und den Ball
    dabei eng am Fuss über die Brücke führen.
  wetteifern: Wer schafft die meisten Überquerungen, ohne von der Wache erwischt zu
    werden?
