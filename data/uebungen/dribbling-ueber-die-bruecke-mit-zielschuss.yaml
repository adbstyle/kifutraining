methodischer_fahrplan:
  offen_starten: Der Weg führt an einer Wache vorbei in die Torzone. Dort wartet eine
    zweite Wache, die es zu umspielen gilt, bevor das Kind auf das Tor abschliesst.
    Zurück zum Start geht es über die Slalombrücke, dann beginnt die nächste Runde.
    Erobert eine Wache den Ball oder spielt ihn ins Aus, tauschen die beiden die Rollen.
  ueben:
  - Die Wache antäuschen, den Ball mit dem Körper abschirmen.
  - Das freie Tor erkennen und gezielt abschliessen.
  wetteifern: Wer kommt an der ersten Wache vorbei? Wer trifft in jeder Runde? Und
    welcher Wache gelingen in einer Minute die meisten Fänge?
