methodischer_fahrplan:
  offen_starten: Die Kinder dribbeln mit ihrem Ball an einer Wache vorbei in die Torzone.
    Dort versuchen sie, eine weitere Wache zu umspielen und ein Tor zu erzielen. Danach
    kehren sie über die Slalombrücke zum Ausgangspunkt zurück und versuchen es erneut.
    Nimmt eine Wache einem Kind den Ball weg oder kann ihn aus dem Feld spielen, tauschen
    sie die Rollen.
  ueben:
  - Wache täuschen und den Ball abschirmen
  - Freies Tor erkennen und präzise abschliessen
  wetteifern: Wer kommt an der Wache vorbei? Wer schafft in jedem Durchgang ein Tor?
    Welche Wache fängt in einer Minute am meisten Kinder?
