anzahl_kinder:
  min: 6
  max: 8
material: []
methodischer_fahrplan:
  offen_starten: Drei Rote starten ihren Angriff von der Grundlinie. Ein Weisses verteidigt
    von Anfang an im Feld. Sobald Rot den Ball zum ersten Mal berührt, kommen Weiss
    2 hinter den Toren hervor und Weiss 3 von der Seite dazu. Tor oder Aus beendet
    den Angriff.
  ueben:
  - Zusammenspielen, die Lücke erkennen und ohne Zögern abschliessen.
  wetteifern: Welches Team trifft in seinem Durchgang? Nach jedem Durchgang wechseln
    die Rollen.
