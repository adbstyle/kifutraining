id: passen-und-ballkontrolle-angreifen-in-ueberzahl-3-3
name: Angreifen in Überzahl – 3:3
trainingsteil: hauptteil
erscheinungsform:
- spiel-kreativ-gestalten
- ball-entschlossen-erobern
feldtyp: kleinfeld
hauptteilkategorie: fussball-spielen-lernen
kategorien:
- F
