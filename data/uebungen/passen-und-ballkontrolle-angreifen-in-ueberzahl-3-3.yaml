methodischer_fahrplan:
  offen_starten: Drei Kinder von Team Rot starten von der Grundlinie aus einen Angriff.
    Ein Kind von Team Weiss verteidigt im Feld. Nach dem ersten Ballkontakt von Team
    Rot dürfen Kind 2 (hinter den Toren) und Kind 3 (von der Seite) von Team Weiss
    ins Spiel eingreifen. Ist der Ball im Tor oder aus dem Feld, ist das Spiel zu
    Ende.
  ueben:
  - Durch Zusammenspiel und Erkennen von freiem Raum die Verteidigung ausspielen und
    sofort den Abschluss suchen
  wetteifern: Welches Team erzielt in einem Durchgang ein Tor? Nach einem Durchgang
    wechseln die Rollen.
