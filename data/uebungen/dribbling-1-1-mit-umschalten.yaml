methodischer_fahrplan:
  offen_starten: Ein Kind dribbelt in Richtung Schusszone und versucht im 1:1 ein
    Tor zu erzielen. Nach dem Abschluss verteidigt es nun. Das nächste Kind startet
    sofort und sucht den Torabschluss.
  ueben:
  - Situation sofort wahrnehmen sowie mit Tempo und schnellen Richtungswechseln ein
    Tor erzielen
  - Danach möglichst rasch Verteidigerrolle einnehmen
  wetteifern: Bilde zwei Teams. Welches Team erzielt mehr Tore? Wechsle nach einem
    Durchgang die Seiten.
