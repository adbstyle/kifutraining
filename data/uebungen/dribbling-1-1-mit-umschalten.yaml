methodischer_fahrplan:
  offen_starten: Das erste Kind zieht mit dem Ball zur Schusszone und sucht im Eins
    gegen Eins den Abschluss. Kaum ist der Ball weg, wird es selbst zum Verteidiger
    — denn ohne Pause startet schon das nächste Kind und will ebenfalls treffen.
  ueben:
  - Die Lage blitzschnell erfassen, mit Tempo und Richtungswechseln zum Tor kommen.
  - 'Nach dem Abschluss keine Pause: sofort in die Verteidigerrolle.'
  wetteifern: Du bildest zwei Teams. Welches trifft häufiger? Nach einem Durchgang
    tauschen die Teams die Seiten.
