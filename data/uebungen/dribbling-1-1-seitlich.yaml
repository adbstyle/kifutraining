methodischer_fahrplan:
  offen_starten: Zwei Kinder starten gleichzeitig. Sobald das erste mit dem Ball die
    Markierung passiert hat, darf es links oder rechts ein Tor erzielen. Ist der Ball
    im Tor oder aus dem Feld, ist das Spiel zu Ende.
  ueben:
  - Mit Körpertäuschung das gegnerische Kind auf eine Seite locken und erfolgreich
    abschliessen
  wetteifern: Bilde zwei Teams. Ein Team verteidigt, das andere greift an. Welches
    Team schafft in zwei Minuten am meisten Tore? Nach zwei Minuten wechseln sie die
    Rollen.
