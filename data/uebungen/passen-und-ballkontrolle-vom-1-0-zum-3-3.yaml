id: passen-und-ballkontrolle-vom-1-0-zum-3-3
name: Vom 1:0 zum 3:3
trainingsteil: hauptteil
erscheinungsform:
- spiel-kreativ-gestalten
- ball-entschlossen-erobern
feldtyp: kleinfeld
hauptteilkategorie: fussball-spielen-lernen
kategorien:
- F
- E
anzahl_kinder:
  min: 6
  max: 8
material: []
methodischer_fahrplan:
  offen_starten: Ein Kind (Team Weiss) dribbelt ins freie Feld und erzielt so schnell
    wie möglich ein Tor. Danach kommt ein Kind von Team Rot mit einem Ball ins Feld
    und die beiden spielen 1:1. Nach einem Tor oder dem Ball im Aus kommt ein weiteres
    Kind von Team Weiss mit einem neuen Ball aufs Feld (2:1). Ist der Ball wiederum
    im Aus oder im Tor, kommt ein weiteres Kind von Team Rot zum 2:2. So geht es weiter,
    bis alle Kinder im Feld sind. Im 3:3 spielen sie noch drei Bälle weiter. Danach
    fängt Team Rot an.
  ueben:
  - In Überzahl mit schnellem Passspiel zum Torerfolg kommen
  - In Gleichzahl freilaufen und mit Dribbling oder mit Pässen Tore erzielen
  wetteifern: Welches Team erzielt bis zum 3:3 mehr Tore?
varianten: []
quelle:
  datei: Manual_Kinderfussball_D.pdf
  seite: 70
