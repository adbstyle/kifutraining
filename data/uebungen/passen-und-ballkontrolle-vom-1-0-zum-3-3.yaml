id: passen-und-ballkontrolle-vom-1-0-zum-3-3
name: Vom 1:0 zum 3:3
trainingsteil: hauptteil
erscheinungsform:
- spiel-kreativ-gestalten
- ball-entschlossen-erobern
feldtyp: kleinfeld
hauptteilkategorie: fussball-spielen-lernen
kategorien:
- F
- E
anzahl_kinder:
  min: 6
  max: 8
material: []
methodischer_fahrplan:
  offen_starten: 'Ein Kind von Weiss dribbelt ins leere Feld und trifft so schnell
    es kann. Dann kommt ein Kind von Rot mit eigenem Ball dazu: Eins gegen Eins. Nach
    Tor oder Aus kommt das nächste Weisse mit neuem Ball — Zwei gegen Eins —, dann
    ein Rotes zum Zwei gegen Zwei, und so weiter, bis alle drin sind. Im Drei gegen
    Drei werden noch drei Bälle ausgespielt. Im nächsten Durchgang beginnt Rot.'
  ueben:
  - In Überzahl mit schnellen Pässen zum Tor kommen.
  - In Gleichzahl freilaufen und per Dribbling oder Pass treffen.
  wetteifern: Welches Team hat bis zum Drei gegen Drei mehr Tore erzielt?
varianten: []
quelle:
  datei: Manual_Kinderfussball_D.pdf
  seite: 70
