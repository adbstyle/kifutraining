methodischer_fahrplan:
  offen_starten: 'Zwei Kinder tragen ein Leibchen in der Hand — sie sind das Feuer.
    Alle anderen dribbeln im Feld und halten Abstand. Wen das Feuer berührt, der hat
    sich verbrannt: Das Kind löst eine Übungsaufgabe oder dribbelt einmal aussen um
    das Feld, bevor es wieder einsteigt.'
  ueben:
  - Ausweichen mit beiden Füssen — Innenseite und Aussenseite abwechselnd.
  - 'Das Feuer austricksen: Körpertäuschung, Übersteiger oder Schere.'
  - 'Kunststücke mit dem Ball: hochwerfen und fangen; hochwerfen, beide Hände kurz
    auf den Boden, im Stehen fangen; hochwerfen, eine ganze Drehung um die eigene
    Achse, fangen; hinter dem Rücken fangen; sich hinsetzen und den Ball im Aufstehen
    fangen.'
  wetteifern: 'Welches Feuer erwischt in einer Minute die meisten Kinder? Oder als
    Kunststück-Wettbewerb: Welches Zweierteam zeigt den eindrucksvollsten Trick?'
varianten: []
