id: passen-und-ballkontrolle-angreifen-in-ueberzahl-3-2
name: Angreifen in Überzahl – 3:2
trainingsteil: hauptteil
erscheinungsform:
- spiel-kreativ-gestalten
- ball-entschlossen-erobern
feldtyp: kleinfeld
hauptteilkategorie: fussball-spielen-lernen
kategorien:
- F
- E
anzahl_kinder:
  min: 5
  max: 7
material: []
methodischer_fahrplan:
  offen_starten: Rot greift auf zwei Tore an; geschossen werden darf erst ab der Mittellinie.
    Ein Verteidiger steht im Feld, der zweite wartet hinter den Toren und darf erst
    loslaufen, sobald die Angreifer den Ball zum ersten Mal berührt haben. Tor oder
    Aus beendet den Angriff.
  ueben:
  - Schnell und genau zusammenspielen oder dribbeln, die Verteidiger ausspielen und
    sofort abschliessen.
  wetteifern: Welchem Team gelingt trotz zweitem Verteidiger ein sauberes Zusammenspiel
    und ein schneller Treffer?
varianten: []
quelle:
  datei: Manual_Kinderfussball_D.pdf
  seite: 72
