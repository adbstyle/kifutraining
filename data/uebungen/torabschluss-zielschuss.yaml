methodischer_fahrplan:
  offen_starten: 'Ein Parcours aus Pylonen führt zum Tor. Die Kinder dribbeln hindurch,
    setzen vor jeder Pylone eine Finte und schiessen am Ende aufs Tor. Dann Ball holen
    und auf der anderen Seite anstellen. Variante: auf Minitore.'
  ueben:
  - Zwei verschiedene Finten zeigen und trotzdem treffen.
  - 'Beidfüssig: einmal links, einmal rechts abschliessen.'
  wetteifern: Wer schafft den Parcours erst mit dem linken, dann mit dem rechten Fuss
    fehlerfrei?
