methodischer_fahrplan:
  offen_starten: 'Über das ganze Feld sind kleine Pylonentore in verschiedenen Farben
    verteilt. Immer zwei Kinder starten zusammen, jedes mit eigenem Ball, und dribbeln
    durch die Tore auf die andere Seite. Du gibst die Strecke vor: ausschliesslich
    rote Tore, derselbe Weg retour, oder eines fährt voraus und das andere folgt.'
  ueben:
  - Eine Fahrt nur mit dem linken Fuss, die nächste nur mit dem rechten.
  - Bei jedem Ballkontakt den Fuss wechseln.
  - 'Drei Fahrten mit vorgegebener Fussfläche: Vollspann, Innenseite, Aussenseite.'
  - Anderen Autos und Hindernissen ausweichen und dabei täuschen — Übersteiger, Schere
    oder ein abrupter Richtungswechsel.
  wetteifern: Team Rot und Team Weiss stellen sich an gegenüberliegenden Seiten auf.
    Beide bekommen dieselbe Route durch die Tore. Welches Team hat sie zuerst komplett
    durchfahren?
