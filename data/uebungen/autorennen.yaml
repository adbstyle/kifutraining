aufbau: 'Zwei Kinder dribbeln mit je einem Ball durch auf dem Spielfeld verteilte
  Tore auf die gegenüberliegende Seite und führen dabei verschiedene Aufgaben aus,
  z. B.: nur durch die roten Tore und den gleichen Weg zurückdribbeln oder einander
  folgen.'
ueben:
- Den Ball nur mit links, dann nur mit rechts führen
- Abwechslungsweise den Ball links und rechts führen
- Nur mit Voll-, Innen- und Aussenrist führen
- Den Hindernissen und anderen Kindern ausweichen sowie Finten schlagen (Übersteiger,
  Schere oder schnell die Richtung wechseln)
wetteifern: Team rot und weiss stehen einander gegenüber. Welches Team durchdribbelt
  die vorgegebene Route am schnellsten?
