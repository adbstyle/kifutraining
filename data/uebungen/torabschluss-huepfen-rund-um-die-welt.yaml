material: []
methodischer_fahrplan:
  offen_starten: 'Farbige Reifen liegen verstreut in einem abgesteckten Feld. Die
    Kinder bewegen sich frei und hüpfen immer wieder in einen Reifen — einbeinig oder
    beidbeinig. Zuerst jedes für sich, dann zu zweit: Eines hüpft vor, das andere
    macht es nach, danach Wechsel.'
  ueben:
  - Sauber landen, ohne den Reifen zu berühren — auf dem Vorderfuss, leicht wie eine
    Gazelle.
  wetteifern: Wer bleibt fehlerfrei? Als Stafette mit derselben Hüpffolge für alle,
    oder die Kinder erfinden eigene Folgen.
