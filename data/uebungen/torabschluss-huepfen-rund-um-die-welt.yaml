anzahl_kinder:
  min: 11
  max: 13
material: []
methodischer_fahrplan:
  offen_starten: In einem markierten Feld liegen farbige Reifen. Die Kinder bewegen
    sich frei im Feld und hüpfen (ein- und beidbeinig) immer wieder in die Reifen.
    Zuerst alleine, anschliessend in Zweierteams. Ein Kind hüpft vor, das andere hüpft
    nach. Danach erfolgt ein Rollenwechsel.
  ueben:
  - Reifen nicht berühren und auf dem Vorderfuss (wie eine Gazelle) springen
  wetteifern: Wer schafft es ohne Fehler? Führ eine Stafette mit gleicher Hüpfabfolge
    durch oder lass die Kinder eigene Hüpfabfolgen erfinden.
