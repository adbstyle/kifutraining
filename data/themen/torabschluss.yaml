name: Torabschluss
id: torabschluss
ziele:
- Die Kinder können den Ball beidfüssig präzise aufs Tor schiessen.
- Die Kinder bereiten mit der Ballkontrolle den Torabschluss gezielt vor und schliessen
  effizient ab.
- Der/die Torspieler/in kann den Ball festhalten und spielt aktiv mit.
- Vor dem Tor entschlossen sein wie eine Raubkatze
metaphern:
- Vor dem Schiessen das Tor fotografieren
- Als Torspieler/in wie eine Katze springen und sich alle Bälle krallen
- Als Torspieler/in die Mitspieler/innen wie ein Orchester dirigieren; den Ball an
  den Fuss nehmen, in den freien Raum dribbeln und mutig passen
fragen_an_die_kinder:
- Was kannst du bei der Ballkontrolle verändern, damit dir der Torabschluss noch besser
  gelingt?
- Warum ist dir dein Torabschluss gut/noch nicht so gut gelungen?
- Hast du die freie Ecke auf dem Foto festgehalten und getroffen?
- Wie hast du versucht, den Ball festzuhalten?
trainingsteil: hauptteil
erscheinungsform:
- mutig-tore-erzielen
- mutig-tore-verhindern
