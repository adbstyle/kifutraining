name: Fussball spielen auf Klein- und Grossfeld
id: fussball-spielen-auf-klein-und-grossfeld
ziele:
- selbstständig das Feld markieren und die Bälle um das Feld verteilen.
- ausgeglichene Teams bilden.
- pro Team eine/n Kapitän/in bestimmen.
- eine Grundordnung/Aufstellung machen.
- das Spiel selbstständig starten. Die Kinder können während des Spiels
- selbstständig und fair spielen.
- auf ein Signal die Spielpositionen rotieren und andere Kinder ein-/auswechseln (alle
  spielen gleich lang). Die Kinder können nach dem Schlusspfiff
- Shakehands mit dem eigenen und dem gegnerischen Team machen.
- gemeinsam Material wegräumen.
- Erarbeite die Ziele schrittweise mit den Kindern.
metaphern:
- Die Kapitäne beider Teams entscheiden bei Fouls, wie das Spiel weitergeht.
- Die Blume öffnet sich bei Ballbesitz des Torspielers/der Torspielerin (Grundordnung).
fragen_an_die_kinder:
- Was bedeutet für dich «fair spielen»?
- Wie konntest du dich mit den anderen bei Fouls auf eine Spielfortsetzung einigen?
- Wie bildest du gleich starke Teams?
- Hast du darauf geachtet, ob alle auf verschiedenen Positionen gespielt haben? G     F       E
  Kleinfeld     Die Kinder spielen auf dem Kleinfeld 1:1 bis 4:4, je nach Anzahl Kinder.
  Gross-        Die Kinder spielen auf dem Grossfeld auf die grossen feld          Tore
  maximal 6:6 (inkl. Torspieler/in). Die maximale Anzahl Kinder im Grossfeld richtet
  sich nach dem Wett­ spiel­format der jeweiligen Kategorie. eil Fussball spielen»
trainingsteil: hauptteil
erscheinungsform:
- respektvoll-fair-spielen
