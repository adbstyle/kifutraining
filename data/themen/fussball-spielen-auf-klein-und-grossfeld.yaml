name: Fussball spielen auf Klein- und Grossfeld
id: fussball-spielen-auf-klein-und-grossfeld
ziele:
- Die Kinder können vor dem Spiel selbstständig das Feld markieren und die Bälle um das Feld verteilen.
- Die Kinder können vor dem Spiel ausgeglichene Teams bilden.
- Die Kinder können vor dem Spiel pro Team eine/n Kapitän/in bestimmen.
- Die Kinder können vor dem Spiel eine Grundordnung/Aufstellung machen.
- Die Kinder können vor dem Spiel das Spiel selbstständig starten.
- Die Kinder können während des Spiels selbstständig und fair spielen.
- Die Kinder können während des Spiels auf ein Signal die Spielpositionen rotieren und andere Kinder ein-/auswechseln (alle spielen gleich lang).
- Die Kinder können nach dem Schlusspfiff Shakehands mit dem eigenen und dem gegnerischen Team machen.
- Die Kinder können nach dem Schlusspfiff gemeinsam Material wegräumen.
metaphern:
- Erarbeite die Ziele schrittweise mit den Kindern.
- Die Kapitäne beider Teams entscheiden bei Fouls, wie das Spiel weitergeht.
- Die Blume öffnet sich bei Ballbesitz des Torspielers/der Torspielerin (Grundordnung).
fragen_an_die_kinder:
- Was bedeutet für dich «fair spielen»?
- Wie konntest du dich mit den anderen bei Fouls auf eine Spielfortsetzung einigen?
- Wie bildest du gleich starke Teams?
- Hast du darauf geachtet, ob alle auf verschiedenen Positionen gespielt haben?
trainingsteil: hauptteil
erscheinungsform:
- respektvoll-fair-spielen
