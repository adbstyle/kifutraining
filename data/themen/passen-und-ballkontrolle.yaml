name: Passen und Ballkontrolle
id: passen-und-ballkontrolle
ziele:
- können den Ball kontrollieren und erfolgreich den ersten Ballkontakt in den freien
  Raum ausführen.
- spielen einen präzisen und entsprechend dosierten Pass zum/zur Mitspieler/in.
- können sich freilaufen und anbieten (Sonne scheint dich an).
- können Breite und Tiefe schaffen (Blume öffnet sich bei eigenem Ballbesitz).
metaphern:
- Fuss als Golfschläger verstehen
- Vor dem Pass ein Foto des Ziels machen
- Als Superman oder Superwoman mit dem Ball alles können
- Körper als Schutzschild für den Ball nutzen
- Ball als Sonne begreifen, die einen anscheint
- Team als Blume begreifen, die sich bei Ballbesitz öffnet und umgekehrt
fragen_an_die_kinder:
- Was kannst du tun, damit deine Pässe noch präziser ankommen?
- Wie kannst du den Ball noch besser kontrollieren und in den freien Raum mitnehmen?
- Hat sich die Blume geöffnet und konnte dich die Sonne anscheinen, oder standst du
  im Schatten?
trainingsteil: hauptteil
erscheinungsform:
- spiel-kreativ-gestalten
- ball-entschlossen-erobern
