name: Dribbling
id: dribbling
ziele:
- können den Ball beidfüssig und eng führen.
- suchen mutig das 1:1, kennen passende Finten und wenden diese an.
metaphern:
- Den Ball als Hund verstehen
- Superman oder Superwoman sein
- Körper als Schutzschild für den Ball einsetzen
- Täuschen und schlau sein wie ein Fuchs
fragen_an_die_kinder:
- Wie hast du das Dribbling jeweils gemacht?
- Was ist dir gut gelungen?
- Was kannst du noch besser machen?
trainingsteil: hauptteil
erscheinungsform:
- spiel-kreativ-gestalten
- ball-entschlossen-erobern
